name: Bug report
description: Report incorrect PDFConcat behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please avoid attaching confidential PDFs. Prefer a minimal synthetic reproduction.
  - type: input
    id: version
    attributes:
      label: PDFConcat version
      placeholder: Output of `pdfconcat --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or plan
      description: Remove private paths or data where necessary.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
