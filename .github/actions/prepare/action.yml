name: Prepare toolchain
description: >-
  Installs the Go toolchain declared by go.mod, exports the development tool versions pinned in
  tools/versions.env, and optionally installs verified tools into .tools/bin.

inputs:
  tools:
    description: >-
      Space-separated names for `go run ./tools/installtools`, including the reviewed source-patched
      golangci-lint build. Leave empty to install none.
    default: ""
  cache:
    description: >-
      Whether setup-go restores and saves the module and build caches. Release and attestation jobs
      turn it off so that no artifact depends on cache contents.
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.cache }}

    - name: Export pinned tool versions
      shell: bash
      run: |
        set -euo pipefail
        awk '
          {
            line = $0
            sub(/^[[:space:]]+/, "", line)
            sub(/[[:space:]]+$/, "", line)
            if (line == "" || line ~ /^#/) next
            equal = index(line, "=")
            key = substr(line, 1, equal - 1)
            setting = substr(line, equal + 1)
            if (!equal || key !~ /^[A-Z_][A-Z0-9_]*$/ || setting == "" || seen[key]++) {
              print "tools/versions.env: invalid or duplicate assignment at line " NR > "/dev/stderr"
              invalid = 1
              exit 1
            }
            output = output key "=" setting "\n"
          }
          END { if (!invalid) printf "%s", output }
        ' tools/versions.env >> "$GITHUB_ENV"

    - name: Install development tools
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: |
        go run ./tools/installtools $TOOLS
        echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
