name: Install independent PDF QA tools
description: >-
  Installs qpdf and Poppler, the independent validator, renderer and text extractor that tests use
  as oracles, and checks their versions. They are development and CI tools only; PDFConcat never
  runs them. Windows installs the exact versions pinned in tools/versions.env from checksum-verified release archives;
  Linux installs the distribution's packages and macOS Homebrew's current formulae, neither of
  which can be pinned to an exact version, so every platform enforces the minimum versions the
  tests were written against and prints what was installed.

runs:
  using: composite
  steps:
    - name: Install (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends --yes qpdf poppler-utils

    - name: Install (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install qpdf poppler

    - name: Install (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        set -a
        . tools/versions.env
        set +a
        pwsh -NoProfile -File tools/install-qa-windows.ps1

    - name: Verify versions
      shell: bash
      run: |
        set -euo pipefail
        . tools/versions.env
        # Git Bash prepends its bundled Xpdf ahead of GITHUB_PATH; use both verified distributions first.
        if [ "$RUNNER_OS" = "Windows" ]; then
          export PATH="$(cygpath -u "$PDFCONCAT_QPDF_BIN"):$(cygpath -u "$PDFCONCAT_POPPLER_BIN"):$PATH"
        fi
        type -a qpdf pdftotext pdfinfo pdftoppm
        if qpdf_output="$(qpdf --version 2>&1)"; then qpdf_status=0; else qpdf_status=$?; fi
        if poppler_output="$(pdftotext -v 2>&1)"; then poppler_status=0; else poppler_status=$?; fi
        if info_output="$(pdfinfo -v 2>&1)"; then info_status=0; else info_status=$?; fi
        if renderer_output="$(pdftoppm -v 2>&1)"; then renderer_status=0; else renderer_status=$?; fi
        printf 'pdfinfo version command exit=%s\n%s\n' "$info_status" "$info_output"
        printf 'pdftoppm version command exit=%s\n%s\n' "$renderer_status" "$renderer_output"
        printf 'qpdf version command exit=%s\n%s\n' "$qpdf_status" "$qpdf_output"
        printf 'pdftotext version command exit=%s\n%s\n' "$poppler_status" "$poppler_output"
        if [ "$qpdf_status" -ne 0 ]; then exit "$qpdf_status"; fi
        if [ "$poppler_status" -ne 0 ]; then exit "$poppler_status"; fi
        if [ "$renderer_status" -ne 0 ]; then exit "$renderer_status"; fi
        if [ "$info_status" -ne 0 ]; then exit "$info_status"; fi
        qpdf_version="$(printf '%s\n' "$qpdf_output" | awk 'NR == 1 {print $3}')"
        poppler_version="$(printf '%s\n' "$poppler_output" | awk 'NR == 1 {print $3}')"
        renderer_version="$(printf '%s\n' "$renderer_output" | awk 'NR == 1 {print $3}')"
        info_version="$(printf '%s\n' "$info_output" | awk 'NR == 1 {print $3}')"
        [ "$info_version" = "$poppler_version" ] || { echo "Poppler metadata oracle version disagrees"; exit 1; }
        [ "$renderer_version" = "$poppler_version" ] || { echo "Poppler oracle versions disagree"; exit 1; }
        if [ "$RUNNER_OS" = "Windows" ]; then
          [ "$qpdf_version" = "$QPDF_WINDOWS_VERSION" ] || { echo "qpdf differs from its exact Windows pin"; exit 1; }
          [ "$poppler_version" = "${POPPLER_WINDOWS_RELEASE%-*}" ] || { echo "Poppler differs from its exact Windows pin"; exit 1; }
        fi
        echo "qpdf $qpdf_version, poppler $poppler_version"
        {
          echo "### Independent PDF QA tools (${RUNNER_OS} ${RUNNER_ARCH})"
          echo "- qpdf ${qpdf_version} (minimum ${QA_QPDF_MIN_VERSION})"
          echo "- poppler ${poppler_version} (minimum ${QA_POPPLER_MIN_VERSION})"
        } >> "$GITHUB_STEP_SUMMARY"
        at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | awk 'NR == 1 {print}')" = "$2" ]; }
        at_least "$qpdf_version" "$QA_QPDF_MIN_VERSION" || { echo "qpdf $qpdf_version is older than $QA_QPDF_MIN_VERSION"; exit 1; }
        at_least "$poppler_version" "$QA_POPPLER_MIN_VERSION" || { echo "poppler $poppler_version is older than $QA_POPPLER_MIN_VERSION"; exit 1; }

    - name: Missing required QA tools must fail, not skip
      shell: bash
      run: go test -count=1 -run '^TestRequiredToolsRejectMissingPrerequisite$' ./internal/pdforacle
