name: Verification campaigns

# Exact-source campaigns are reusable by source-release verification and may be dispatched alone.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      verified_sha:
        description: Source commit whose complete campaign jobs succeeded
        value: ${{ jobs.approve.outputs.verified_sha }}

permissions:
  contents: read

env:
  PDFCONCAT_REQUIRE_QA_TOOLS: "1"

concurrency:
  group: verification-campaigns-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Bounded smoke fuzzing: every Fuzz target discovered with `go test -list`, 30 seconds each. The
  # job fails when it finds none. Longer runs: CONTRIBUTING.md.
  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          cache: "false"
      - name: Record exact source and native environment
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          { printf 'source_sha=%s\nrunner=%s\nimage=%s %s\n' "$source_sha" "$RUNNER_OS/$RUNNER_ARCH" "$ImageOS" "$ImageVersion"; go version; } > "$RUNNER_TEMP/campaign-source.txt"
      - uses: ./.github/actions/qa-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-source-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/campaign-source.txt
          if-no-files-found: error
      - name: Execute discovered targets
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/qualitygate fuzz -time 30s 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-fuzz-${{ github.sha }}
          path: ${{ runner.temp }}/fuzz.log
          if-no-files-found: error
      - name: Keep failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failing-inputs
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  mutation-tools-linux:
    uses: ./.github/workflows/mutation-tools.yml
    with:
      os: ubuntu-latest
  mutation-tools-macos:
    uses: ./.github/workflows/mutation-tools.yml
    with:
      os: macos-latest
  mutation-tools-windows:
    uses: ./.github/workflows/mutation-tools.yml
    with:
      os: windows-latest

  # Mutation testing runs in a snapshot copied out of this clean checkout, never over the working tree.
  mutation:
    name: Mutation testing (${{ matrix.os }}, ${{ matrix.partition }})
    needs: [mutation-tools-linux, mutation-tools-macos, mutation-tools-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            producer: mutation-tools-linux
          - os: macos-latest
            producer: mutation-tools-macos
          - os: windows-latest
            producer: mutation-tools-windows
        partition: [0/12, 1/12, 2/12, 3/12, 4/12, 5/12, 6/12, 7/12, 8/12, 9/12, 10/12, 11/12]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          cache: "false"
      - name: Select this native producer's immutable artifact
        id: tools
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs[matrix.producer].outputs.artifact_id }}
          RECEIPT: ${{ needs[matrix.producer].outputs.receipt }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$RECEIPT"
          printf 'artifact_id=%s\nreceipt=%s\n' "$ARTIFACT_ID" "$RECEIPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.tools.outputs.artifact_id }}
          path: .tools/bin/
          digest-mismatch: error
      - name: Verify trusted native tool bytes before execution
        shell: bash
        env:
          PDFCONCAT_MUTATION_TOOLS: ${{ steps.tools.outputs.receipt }}
        run: |
          set -euo pipefail
          go run ./tools/qualitygate verify-mutation-tools
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Record exact source and native environment
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          { printf 'source_sha=%s\nrunner=%s\nimage=%s %s\n' "$source_sha" "$RUNNER_OS/$RUNNER_ARCH" "$ImageOS" "$ImageVersion"; go version; } > "$RUNNER_TEMP/campaign-source.txt"
      - uses: ./.github/actions/qa-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-source-${{ github.job }}-${{ runner.os }}-${{ strategy.job-index }}-${{ github.sha }}
          path: ${{ runner.temp }}/campaign-source.txt
          if-no-files-found: error
      - run: go run ./tools/qualitygate mutation -partition=${{ matrix.partition }} -max-duration=5h30m -workers=2 -report "${{ runner.temp }}/mutation-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/mutation-report.json
            ${{ runner.temp }}/mutation-report.json.scope.json
            ${{ runner.temp }}/mutation-report.json.discovery.json
            ${{ runner.temp }}/mutation-report.json.executions/**
            ${{ runner.temp }}/mutation-report.json.discovery.json.executions/**
          if-no-files-found: error

  # The deliberate defects in tools/mutation-controls.yml must each make the tests fail.
  mutation-controls:
    name: Mutation negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          cache: "false"
      - name: Record exact source and native environment
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          { printf 'source_sha=%s\nrunner=%s\nimage=%s %s\n' "$source_sha" "$RUNNER_OS/$RUNNER_ARCH" "$ImageOS" "$ImageVersion"; go version; } > "$RUNNER_TEMP/campaign-source.txt"
      - uses: ./.github/actions/qa-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-source-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/campaign-source.txt
          if-no-files-found: error
      - run: go run ./tools/qualitygate controls

  # ./test/scale defines TestScaleAcceptance. The job fails if the package or the test does not exist, or if the test
  # skips. It runs on ubuntu-latest, which has four cores on public repositories; the declared
  # budgets are meaningful only on a runner with four cores or more.
  scale:
    name: Scale acceptance
    runs-on: ubuntu-latest
    env:
      PDFCONCAT_SCALE: "1"
    timeout-minutes: 60
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          cache: "false"
      - name: Record exact source and native environment
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          { printf 'source_sha=%s\nrunner=%s\nimage=%s %s\n' "$source_sha" "$RUNNER_OS/$RUNNER_ARCH" "$ImageOS" "$ImageVersion"; go version; } > "$RUNNER_TEMP/campaign-source.txt"
      - uses: ./.github/actions/qa-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: campaign-source-${{ github.job }}-${{ runner.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/campaign-source.txt
          if-no-files-found: error
      - run: >-
          go run ./tools/qualitygate test -events "${{ runner.temp }}/test-events.json"
          -run '^TestScaleAcceptance$' -require TestScaleAcceptance -timeout 30m ./test/scale
        env:
          PDFCONCAT_SCALE_RESULTS: ${{ runner.temp }}/scale-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scale-results
          path: |
            ${{ runner.temp }}/scale-results.json
            ${{ runner.temp }}/test-events.json
            ${{ runner.temp }}/test-events.json.stderr
          if-no-files-found: error

  approve:
    name: Require complete exact-source campaign outcomes
    if: always()
    needs: [fuzz, mutation, mutation-controls, scale, mutation-tools-linux, mutation-tools-macos, mutation-tools-windows]
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.approve.outputs.sha }}
    steps:
      - name: Reject failed, skipped, cancelled or wrong-source campaigns
        id: approve
        env:
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          CONTROLS_RESULT: ${{ needs.mutation-controls.result }}
          SCALE_RESULT: ${{ needs.scale.result }}
          FUZZ_SHA: ${{ needs.fuzz.outputs.source_sha }}
          MUTATION_SHA: ${{ needs.mutation.outputs.source_sha }}
          CONTROLS_SHA: ${{ needs.mutation-controls.outputs.source_sha }}
          SCALE_SHA: ${{ needs.scale.outputs.source_sha }}
          TOOLS_LINUX_RESULT: ${{ needs.mutation-tools-linux.result }}
          TOOLS_MACOS_RESULT: ${{ needs.mutation-tools-macos.result }}
          TOOLS_WINDOWS_RESULT: ${{ needs.mutation-tools-windows.result }}
          TOOLS_LINUX_SHA: ${{ needs.mutation-tools-linux.outputs.source_sha }}
          TOOLS_MACOS_SHA: ${{ needs.mutation-tools-macos.outputs.source_sha }}
          TOOLS_WINDOWS_SHA: ${{ needs.mutation-tools-windows.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$FUZZ_RESULT" "$MUTATION_RESULT" "$CONTROLS_RESULT" "$SCALE_RESULT" "$TOOLS_LINUX_RESULT" "$TOOLS_MACOS_RESULT" "$TOOLS_WINDOWS_RESULT"; do test "$result" = success; done
          for sha in "$FUZZ_SHA" "$MUTATION_SHA" "$CONTROLS_SHA" "$SCALE_SHA" "$TOOLS_LINUX_SHA" "$TOOLS_MACOS_SHA" "$TOOLS_WINDOWS_SHA"; do test "$sha" = "$GITHUB_SHA"; done
          printf 'sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
