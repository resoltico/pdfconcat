name: CI

on:
  # Protected main requires PR CI; version tags invoke this workflow for release qualification.
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit selected by the release workflow
        type: string
        default: ''
      release_tag:
        description: Existing release tag; empty for snapshot qualification
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Modules are tidy
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - name: No inline lint suppressions
        run: |
          if git grep -n -E '//[[:space:]]*nolint' -- '*.go' ':!third_party/**'; then
            echo "Inline //nolint is not allowed; add a commented exclusion to .golangci.yml instead."
            exit 1
          fi
      - name: golangci-lint (linux, darwin, windows)
        run: |
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$RUNNER_TEMP/golangci-lint" run ./...
            echo "::endgroup::"
          done
      - name: Workflow lint
        run: |
          actionlint_version=$(go list -modfile=tools/go.mod -m -f '{{.Version}}' github.com/rhysd/actionlint)
          go run "github.com/rhysd/actionlint/cmd/actionlint@$actionlint_version"
      - name: Generated contracts and dependency source
        run: |
          go run ./internal/contractgen -check
          python3 .github/scripts/verify-dependency.py
          python3 -m unittest discover -s .github/scripts -p '*_test.py'
          (cd third_party/pdfcpu && go test ./pkg/pdfcpu ./pkg/pdfcpu/types ./pkg/pdfcpu/model -run 'TestZeroOffsetEntryPolicy|TestEncryptedInputReadPolicy|TestFloatPDFRoundTrip|TestRealLexicalRoundTripAndIntegerRangeRefusal' -count=1)
      - name: Installer packaging tests
        run: python3 -m unittest discover -s install -p '*_test.py'
      - name: Installer shell lint
        run: shellcheck install/*.sh .github/scripts/*.sh
      - name: Installer PowerShell lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path install -Settings install/PSScriptAnalyzerSettings.psd1)
          $findings | Format-Table -AutoSize RuleName, ScriptName, Line, Message
          if ($findings.Count) { exit 1 }
      - name: Known vulnerabilities
        run: go tool -modfile=tools/go.mod govulncheck ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install independent PDF tools (qpdf, Poppler)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils default-jre-headless
          qpdf_version=$(cat internal/oracle/qpdf.version)
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/qpdf.zip" "https://github.com/qpdf/qpdf/releases/download/v${qpdf_version}/qpdf-${qpdf_version}-bin-linux-x86_64.zip"
          echo "db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1  $RUNNER_TEMP/qpdf.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          chmod +x "$RUNNER_TEMP/qpdf/bin/qpdf"
          "$RUNNER_TEMP/qpdf/bin/qpdf" --version
          echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"
          verapdf_version=$(cat internal/oracle/verapdf.version)
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/verapdf.zip" "https://software.verapdf.org/releases/${verapdf_version%.*}/verapdf-greenfield-${verapdf_version}-installer.zip"
          echo "04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23  $RUNNER_TEMP/verapdf.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP/verapdf-installer"
          python3 -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "verapdf-install.xml").write_text(pathlib.Path(".github/scripts/verapdf-install.xml").read_text().replace("@INSTALL_PATH@", os.environ["RUNNER_TEMP"] + "/verapdf"))'
          java -Djava.awt.headless=true -jar "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-$verapdf_version/verapdf-izpack-installer-$verapdf_version.jar" "$RUNNER_TEMP/verapdf-install.xml"
          "$RUNNER_TEMP/verapdf/verapdf" --version
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
      - name: Test with race detector (oracle required on Linux)
        if: runner.os != 'Windows'
        env:
          PDFCONCAT_REQUIRE_ORACLE: ${{ runner.os == 'Linux' && '1' || '' }}
          PDFCONCAT_REQUIRE_VERAPDF: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  build:
    name: Build all release targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/pdfconcat
          done

  package:
    name: Release packaging
    # Darwin executables are ad hoc signed during the build, which needs macOS.
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GORELEASER_CURRENT_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned GoReleaser for both clean builds
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          install-only: true
      - name: Build the qualified release files without publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$GORELEASER_CURRENT_TAG" || "$GITHUB_REF_TYPE" == tag ]]; then
            goreleaser release --clean --skip=publish
          else
            goreleaser release --snapshot --clean
          fi
      - name: Stage the published installer bytes
        run: cp .tools/installers/install.sh .tools/installers/install.ps1 .tools/SOURCE.tar.gz dist/
      - name: Verify checksums, archive contents, macOS signatures and minimum OS
        run: |
          # All published assets are staged flat, including the exact installer bytes.
          (cd dist && /usr/bin/shasum -a 256 --check --strict checksums.txt)
          go run ./internal/releasecheck -dir dist
          # Each SBOM describes its own executable's platform.
          for sbom in dist/pdfconcat_*.cdx.json; do
            platform=${sbom#dist/pdfconcat_}; platform=${platform%.cdx.json}
            goos=${platform%_*} goarch=${platform#*_}
            test "$(jq -r '[.components[].purl | capture("goarch=(?<a>[^&]+)&goos=(?<o>[^&]+)") | "\(.o)_\(.a)"] | unique | join(",")' "$sbom")" = "${goos}_${goarch}"
          done
          # The delivered source builds without fetching linked module source.
          source_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/pdfconcat-source.XXXXXX")
          /usr/bin/tar -xzf dist/SOURCE.tar.gz -C "$source_dir"
          (cd "$source_dir/pdfconcat-source" && GOPROXY=off GOSUMDB=off go build -mod=vendor -trimpath -o "$RUNNER_TEMP/pdfconcat-from-source" ./cmd/pdfconcat)
          /usr/bin/cmp LICENSE "$source_dir/pdfconcat-source/LICENSE"
          /bin/rm -rf "$source_dir"
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
          cd dist
          for arch in amd64 arm64; do
            staging_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/pdfconcat-package.XXXXXX")
            /usr/bin/tar -xzf "pdfconcat_darwin_$arch.tar.gz" -C "$staging_dir"
            "$RUNNER_TEMP/govulncheck" -mode=binary "$staging_dir/pdfconcat"
            /usr/bin/codesign --verify --strict "$staging_dir/pdfconcat"
            /usr/bin/codesign --display --verbose=4 "$staging_dir/pdfconcat" 2>&1 | /usr/bin/grep '^Signature=adhoc$'
            /usr/bin/otool -l "$staging_dir/pdfconcat" | /usr/bin/grep -E 'minos 15\.0(\.0)?$'
            /bin/rm -rf "$staging_dir"
          done
      - name: Reproduce all delivered bytes in an independent clean checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          second="$RUNNER_TEMP/pdfconcat-reproducibility"
          git worktree add --detach "$second" HEAD
          goreleaser_binary=$(command -v goreleaser)
          if [[ -n "$GORELEASER_CURRENT_TAG" || "$GITHUB_REF_TYPE" == tag ]]; then
            (cd "$second" && "$goreleaser_binary" release --clean --skip=publish)
          else
            (cd "$second" && "$goreleaser_binary" release --snapshot --clean)
          fi
          cp "$second/.tools/installers/install.sh" "$second/.tools/installers/install.ps1" "$second/.tools/SOURCE.tar.gz" "$second/dist/"
          go run ./internal/releasecheck -dir dist -compare "$second/dist"
          git worktree remove --force "$second"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.cdx.json
            dist/install.sh
            dist/install.ps1

  install:
    name: Install (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, macos-26, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Shells for startup-file checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh fish
      - name: Install, update and uninstall the release archives
        if: runner.os != 'Windows'
        run: bash install/install_test.sh "$PWD/release"
      - name: Install, update and uninstall the release archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install_test.ps1 -Dist "$PWD\release"

  required:
    name: Required CI
    if: always()
    needs: [lint, test, build, package, install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job ended with: $result"
              exit 1
            fi
          done
