name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7d2730e317c8366225b42fced34583b26440a9cc # upstream cache 6.3.0 fix (actions/setup-go#794)
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Modules are tidy
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - name: No inline lint suppressions
        run: |
          if git grep -n -E '//[[:space:]]*nolint' -- '*.go'; then
            echo "Inline //nolint is not allowed; add a commented exclusion to .golangci.yml instead."
            exit 1
          fi
      - name: golangci-lint (linux, darwin, windows)
        run: |
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$RUNNER_TEMP/golangci-lint" run ./...
            echo "::endgroup::"
          done
      - name: Workflow lint
        run: |
          actionlint_version=$(go list -modfile=tools/go.mod -m -f '{{.Version}}' github.com/rhysd/actionlint)
          go run "github.com/rhysd/actionlint/cmd/actionlint@$actionlint_version"
      - name: Installer shell lint
        run: shellcheck install/*.sh .github/scripts/*.sh
      - name: Installer PowerShell lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          $findings = @(Invoke-ScriptAnalyzer -Path install -Settings install/PSScriptAnalyzerSettings.psd1)
          $findings | Format-Table -AutoSize RuleName, ScriptName, Line, Message
          if ($findings.Count) { exit 1 }
      - name: Known vulnerabilities
        run: go tool -modfile=tools/go.mod govulncheck ./...

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7d2730e317c8366225b42fced34583b26440a9cc # upstream cache 6.3.0 fix (actions/setup-go#794)
        with:
          go-version-file: go.mod
      - name: Install independent PDF tools (qpdf, Poppler)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          qpdf_version=$(cat internal/oracle/qpdf.version)
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/qpdf.zip" "https://github.com/qpdf/qpdf/releases/download/v${qpdf_version}/qpdf-${qpdf_version}-bin-linux-x86_64.zip"
          echo "db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1  $RUNNER_TEMP/qpdf.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/qpdf.zip" -d "$RUNNER_TEMP/qpdf"
          chmod +x "$RUNNER_TEMP/qpdf/bin/qpdf"
          "$RUNNER_TEMP/qpdf/bin/qpdf" --version
          echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"
      - name: Test with race detector (oracle required on Linux)
        if: runner.os != 'Windows'
        env:
          PDFCONCAT_REQUIRE_ORACLE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  build:
    name: Build all release targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7d2730e317c8366225b42fced34583b26440a9cc # upstream cache 6.3.0 fix (actions/setup-go#794)
        with:
          go-version-file: go.mod
      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -trimpath -o /dev/null ./cmd/pdfconcat
          done

  package:
    name: Release packaging
    # Darwin executables are ad hoc signed during the build, which needs macOS.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@7d2730e317c8366225b42fced34583b26440a9cc # upstream cache 6.3.0 fix (actions/setup-go#794)
        with:
          go-version-file: go.mod
      - name: Build current-source release files without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --snapshot --clean
      - name: Verify checksums, archive contents, macOS signatures and minimum OS
        run: |
          # The installers are published from install/, not dist/.
          /usr/bin/shasum -a 256 --check --strict <(/usr/bin/sed -E 's#  (install\.(sh|ps1))$#  install/\1#' dist/checksums.txt | /usr/bin/sed -E 's#  (pdfconcat_)#  dist/\1#')
          test "$(/usr/bin/grep -c -E '  (install\.(sh|ps1)|pdfconcat_[a-z]+_(amd64|arm64)\.(tar\.gz|zip|cdx\.json))$' dist/checksums.txt)" = 14
          # Each SBOM describes its own executable's platform.
          for sbom in dist/pdfconcat_*.cdx.json; do
            platform=${sbom#dist/pdfconcat_}; platform=${platform%.cdx.json}
            goos=${platform%_*} goarch=${platform#*_}
            test "$(jq -r '[.components[].purl | capture("goarch=(?<a>[^&]+)&goos=(?<o>[^&]+)") | "\(.o)_\(.a)"] | unique | join(",")' "$sbom")" = "${goos}_${goarch}"
          done
          # Archives hold the program and its license notices, nothing else.
          expected=$( (echo LICENSE; echo THIRD_PARTY_NOTICES.md; cd internal/legal && /bin/ls licenses/*.txt) | LC_ALL=C sort)
          for archive in dist/pdfconcat_*.tar.gz dist/pdfconcat_*.zip; do
            case "$archive" in
              *.zip) members=$(/usr/bin/zipinfo -1 "$archive") program=pdfconcat.exe ;;
              *) members=$(/usr/bin/tar -tzf "$archive") program=pdfconcat ;;
            esac
            test "$(printf '%s\n' "$members" | LC_ALL=C sort)" = "$(printf '%s\n%s\n' "$expected" "$program" | LC_ALL=C sort)"
          done
          go build -modfile=tools/go.mod -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
          cd dist
          for arch in amd64 arm64; do
            staging_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/pdfconcat-package.XXXXXX")
            /usr/bin/tar -xzf "pdfconcat_darwin_$arch.tar.gz" -C "$staging_dir"
            "$RUNNER_TEMP/govulncheck" -mode=binary "$staging_dir/pdfconcat"
            /usr/bin/codesign --verify --strict "$staging_dir/pdfconcat"
            /usr/bin/codesign --display --verbose=4 "$staging_dir/pdfconcat" 2>&1 | /usr/bin/grep '^Signature=adhoc$'
            /usr/bin/otool -l "$staging_dir/pdfconcat" | /usr/bin/grep -E 'minos 15\.0(\.0)?$'
            /bin/rm -rf "$staging_dir"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  install:
    name: Install (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel, macos-26, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Shells for startup-file checks
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsh fish
      - name: Install, update and uninstall the release archives
        if: runner.os != 'Windows'
        run: bash install/install_test.sh "$PWD/release"
      - name: Install, update and uninstall the release archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install_test.ps1 -Dist "$PWD\release"

  required:
    name: Required CI
    if: always()
    needs: [lint, test, build, package, install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job ended with: $result"
              exit 1
            fi
          done
