name: Coverage failure evidence control

# A deliberately red run exercises the real collector/upload boundary without changing product code.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/coverage-evidence-control.yml
permissions:
  contents: read
jobs:
  failed-collection:
    name: Deliberate coverage failure retains evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          tools: golangci-lint
      - uses: ./.github/actions/qa-tools
      - name: Inject one ordinary test failure into the exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat > internal/observation/coverage_failure_control_test.go <<'GO'
          package observation
          import "testing"
          func TestCoverageEvidenceOrdinaryFailure(t *testing.T) { t.Fatal("deliberate hosted evidence retention control") }
          GO
      - name: Run the actual instrumented collector and preserve its failure
        run: go run ./tools/qualitygate coverage -evidence "${{ runner.temp }}/coverage-evidence"
        env:
          PDFCONCAT_REQUIRE_QA_TOOLS: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: failed-coverage-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/coverage-evidence
          if-no-files-found: error
          retention-days: 14
