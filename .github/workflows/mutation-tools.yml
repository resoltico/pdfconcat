name: Native mutation tools
on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      receipt:
        value: ${{ jobs.build.outputs.receipt }}
      source_sha:
        value: ${{ jobs.build.outputs.source_sha }}
permissions:
  contents: read
jobs:
  build:
    name: Build and verify native mutation tools
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      receipt: ${{ steps.record.outputs.receipt }}
      source_sha: ${{ steps.record.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reject wrong or dirty source before building tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - uses: ./.github/actions/prepare
        with:
          tools: gremlins golangci-lint
          cache: "false"
      - name: Record verified native tool bytes and exact source
        id: record
        shell: bash
        run: |
          set -euo pipefail
          receipt=$(go run ./tools/qualitygate record-mutation-tools)
          printf '%s\n' "$receipt"
          printf 'receipt=%s\nsource_sha=%s\n' "$receipt" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: mutation-tools-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .tools/bin/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
