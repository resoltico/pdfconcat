name: Source release

# Publishes the tagged source and CHANGELOG notes only. Binary packages, their attestations,
# and manually triggered campaigns are separate work and are not claimed by this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish tagged source and changelog notes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          cache: "false"
      - name: Require the source tag to match the configured version
        run: go run ./tools/qualitygate release-version -tag "$TAG"
      - name: Extract exact nonempty changelog notes
        run: go run ./tools/qualitygate release-notes -tag "$TAG" -output "$RUNNER_TEMP/release-notes.md"
      - name: Require the remote tag to still identify this verified commit
        shell: bash
        run: |
          set -euo pipefail
          reference=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | [.type, .sha] | @tsv')
          IFS=$'\t' read -r object_type object_sha <<< "$reference"
          if [ "$object_type" = tag ]; then
            reference=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object | [.type, .sha] | @tsv')
            IFS=$'\t' read -r object_type object_sha <<< "$reference"
          fi
          test "$object_type" = commit
          test "$object_sha" = "$GITHUB_SHA"
      - name: Publish source-only release
        shell: bash
        run: |
          set -euo pipefail
          classification=()
          case "$TAG" in
            *-*) classification+=(--prerelease) ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "PDFConcat ${TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${classification[@]}"
