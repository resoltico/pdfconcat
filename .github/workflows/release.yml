name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished version tag to qualify and publish
        type: string
        required: true
      qualified_run_id:
        description: Optional prior Release run whose Required CI passed for these exact assets
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    name: Resolve the existing release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" == v* ]]
          git check-ref-format "refs/tags/$TAG"
          source_sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$source_sha" origin/main
          printf 'tag=%s\nsha=%s\n' "$TAG" "$source_sha" >> "$GITHUB_OUTPUT"

  ci:
    if: ${{ !inputs.qualified_run_id }}
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
      release_tag: ${{ needs.source.outputs.tag }}

  release:
    name: Publish the qualified artifacts
    needs: [source, ci]
    if: ${{ always() && needs.source.result == 'success' && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && inputs.qualified_run_id != '')) }}
    # Signing, packaging and all seven native installer jobs ran in reusable CI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write      # create the GitHub release; never create its tag
      actions: read        # retrieve a prior qualified artifact without rebuilding
      id-token: write      # artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.source.outputs.sha }}
      - name: Validate a previously qualified run
        id: qualification
        if: ${{ inputs.qualified_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          e = os.environ
          run_id = e['QUALIFIED_RUN_ID']
          if not run_id.isascii() or not run_id.isdecimal() or int(run_id) <= 0:
              raise SystemExit('Qualified run ID must be a positive decimal integer.')
          prefix = 'repos/' + e['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', prefix + path]))
          run = api('/actions/runs/' + run_id)
          workflow = api('/actions/workflows/release.yml')
          if run['status'] != 'completed' or run['workflow_id'] != workflow['id'] or run['event'] not in ('push', 'workflow_dispatch'):
              raise SystemExit('Expected a completed Release workflow run.')
          subprocess.run(['git', 'merge-base', '--is-ancestor', run['head_sha'], 'origin/main'], check=True)
          def definition(revision):
              return subprocess.check_output(['git', 'show', revision + ':.github/workflows/ci.yml'])
          if definition(run['head_sha']) != definition(e['WORKFLOW_SHA']):
              raise SystemExit('Qualification workflow changed; complete fresh qualification.')
          def items(path, key):
              pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp', prefix + path]))
              return [item for page in pages for item in page[key]]
          jobs = items('/actions/runs/' + run_id + '/jobs?filter=all&per_page=100', 'jobs')
          latest = {j['name']: j for j in sorted(jobs, key=lambda j: j['id'])}
          if latest.get('ci / Required CI', {}).get('conclusion') != 'success':
              raise SystemExit('The prior run did not pass Required CI.')
          artifacts = items('/actions/runs/' + run_id + '/artifacts?per_page=100', 'artifacts')
          assets = [a for a in artifacts if a['name'] == 'release-files']
          if len(assets) != 1 or assets[0]['expired']:
              raise SystemExit('The qualified artifact is missing or expired; no rebuild fallback.')
          artifact = assets[0]
          digest = artifact.get('digest', '')
          if not digest.startswith('sha256:') or len(digest) != 71:
              raise SystemExit('Qualified artifact has no SHA256 identity.')
          identity = {'run_id': run_id, 'workflow_sha': run['head_sha'], 'artifact_url': artifact['url'], 'sha256': digest[7:]}
          Path(e['RUNNER_TEMP'], 'qualification.json').write_text(json.dumps(identity), encoding='utf-8')
          with open(e['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('artifact_id=' + str(artifact['id']) + '\n')
          PYTHON
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ !inputs.qualified_run_id && 'release-files' || '' }}
          artifact-ids: ${{ steps.qualification.outputs.artifact_id }}
          merge-multiple: true
          path: release
          run-id: ${{ inputs.qualified_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Release notes from the tagged CHANGELOG.md
        env:
          TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
          version="${TAG#v}"
          git show HEAD:CHANGELOG.md | awk -v version="$version" '
            BEGIN { heading = "## [" version "]" }
            /^##([[:space:]]|$)/ {
              inside = ($0 == heading || index($0, heading " ") == 1)
              if (inside) {
                matches++
                date = substr($0, length(heading) + 1)
                if (date !~ /^ - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) invalid = 1
              }
              next
            }
            inside {
              notes = notes $0 "\n"
              if ($0 ~ /[^[:space:]]/) content = 1
            }
            END {
              if (matches != 1 || invalid || !content) {
                print "Expected one nonempty dated CHANGELOG.md entry for " version > "/dev/stderr"
                exit 1
              }
              printf "%s", notes
            }
          ' > "$RUNNER_TEMP/release-notes.md"
      - name: Verify the complete qualified asset set
        run: |
          set -euo pipefail
          go run ./internal/releasecheck -dir release

      - name: Bind the qualified assets to the tagged source and version
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess, tarfile
          from pathlib import Path
          e = os.environ
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open('release/SOURCE.tar.gz') as source:
              for name in filter(None, names):
                  entry = source.getmember('pdfconcat-source/' + name)
                  if not entry.isfile() or source.extractfile(entry).read() != Path(name).read_bytes():
                      raise SystemExit('Qualified source differs from tag: ' + name)
          executable = Path(e['RUNNER_TEMP'], 'qualified-pdfconcat')
          with tarfile.open('release/pdfconcat_linux_amd64.tar.gz') as binary:
              executable.write_bytes(binary.extractfile('pdfconcat').read())
          executable.chmod(0o700)
          version = json.loads(subprocess.check_output([str(executable), 'version', '--json']))
          if version['commit'] != e['SOURCE_SHA'] or version['version'] != e['TAG'][1:]:
              raise SystemExit('Qualified executable does not match the tag commit/version.')
          PYTHON
      - name: Bind provenance to source and workflow revisions
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          TAG: ${{ needs.source.outputs.tag }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          e = os.environ
          repository = e['GITHUB_SERVER_URL'] + '/' + e['GITHUB_REPOSITORY']
          tag_ref = 'refs/tags/' + e['TAG']
          predicate = {
              'buildDefinition': {
                  'buildType': 'https://actions.github.io/buildtypes/workflow/v1',
                  'externalParameters': {
                      'workflow': {'ref': e['GITHUB_REF'], 'repository': repository, 'path': '.github/workflows/release.yml'},
                  },
                  'internalParameters': {'github': {
                      'event_name': e['GITHUB_EVENT_NAME'],
                      'repository_id': e['GITHUB_REPOSITORY_ID'],
                      'repository_owner_id': e['GITHUB_REPOSITORY_OWNER_ID'],
                      'runner_environment': e['RUNNER_ENVIRONMENT'],
                  }},
                  'resolvedDependencies': [
                      {'name': 'release-workflow', 'uri': 'git+' + repository + '@' + e['GITHUB_REF'], 'digest': {'gitCommit': e['WORKFLOW_SHA']}},
                      {'name': 'release-source', 'uri': 'git+' + repository + '@' + tag_ref, 'digest': {'gitCommit': e['SOURCE_SHA']}},
                  ],
              },
              'runDetails': {
                  'builder': {'id': e['GITHUB_SERVER_URL'] + '/' + e['WORKFLOW_REF']},
                  'metadata': {'invocationId': repository + '/actions/runs/' + e['GITHUB_RUN_ID'] + '/attempts/' + e['GITHUB_RUN_ATTEMPT']},
              },
          }
          qualification = Path(e['RUNNER_TEMP'], 'qualification.json')
          if qualification.exists():
              prior = json.loads(qualification.read_text(encoding='utf-8'))
              predicate['buildDefinition']['resolvedDependencies'].append({
                  'name': 'qualified-inputs', 'uri': prior['artifact_url'], 'digest': {'sha256': prior['sha256']},
              })
              predicate['buildDefinition']['internalParameters']['qualification'] = {
                  'run_id': prior['run_id'], 'workflow_sha': prior['workflow_sha'],
              }
          Path(e['RUNNER_TEMP'], 'release-provenance.json').write_text(json.dumps(predicate) + '\n', encoding='utf-8')
          PYTHON
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/release-provenance.json
          subject-path: |
            release/*.tar.gz
            release/*.zip
            release/checksums.txt
            release/*.cdx.json
            release/install.sh
            release/install.ps1
      - name: Publish without rebuilding or modifying the qualified files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          set -euo pipefail
          # Prerelease tags stay prereleases; build metadata may contain hyphens.
          version="${TAG#v}"
          base_version="${version%%+*}"
          options=()
          case "$base_version" in *-*) options+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" "${options[@]}" \
            release/*.tar.gz release/*.zip release/*.cdx.json release/install.sh release/install.ps1 release/checksums.txt
