            - desc: OS-specific syscalls belong to publish, capture, app, permissiontest, cmd and the scale harness
              pkg: golang.org/x/sys
          files:
            - '!**/internal/publish/*.go'
            - '!**/internal/capture/*.go'
            - '!**/internal/app/*.go'
            - '!**/internal/permissiontest/*.go'
            - '!**/cmd/pdfconcat/*.go'
            - '!**/test/scale/*.go'
