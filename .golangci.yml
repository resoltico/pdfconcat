              pkg: github.com/pdfcpu/pdfcpu
            - desc: maintained PDF content parsing and encoding tables belong to internal/pdfengine
              pkg: github.com/benoitkugler/pdf
            - desc: maintained PDF tokenization belongs to internal/pdfengine
              pkg: github.com/benoitkugler/pstokenizer
          files:
            - '!**/internal/pdfengine/*.go'
            - '!**/internal/pdfengine/**/*.go'
          list-mode: lax
        platform-boundary:
