# golangci-lint configuration: every linter, strict settings, no hidden exceptions.
#
# This file holds the strictness settings. Every exception (a disabled linter, a disabled check,
# an ignore list, a diagnostic exclusion) is written down once, with its rationale, in
# .quality-exceptions.yml. `go run ./tools/qualitygate lint-config` fails when this file carries an
# exception the registry does not list, or lacks one it does. Exceptions are never written
# next to the code: `//nolint` and its siblings are rejected by internal/repopolicy.
#
# Numeric thresholds are settings, not exceptions. Each states the readability argument for its
# number; there is no universal strictest value.
version: "2"

run:
  timeout: 10m
  tests: true
  issues-exit-code: 1
  modules-download-mode: readonly

output:
  sort-order: [file, linter, severity]

issues:
  # Report everything: by default golangci-lint truncates after 50 issues per linter and 3 identical
  # messages, and merges multiple issues on one line.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false
  new-from-rev: ""
  new-from-patch: ""
  new-from-merge-base: ""

linters:
  default: all

  # Exceptions are listed in .quality-exceptions.yml.
  disable:
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - nlreturn
    - noinlineerr
    - wsl

  settings:
    asasalint:
      use-builtin-exclusions: false
    cyclop:
      # McCabe's classic limit is 10; 12 leaves room for a flat switch over the small enums here.
      max-complexity: 12
      # A package averaging more than 6 paths per function is tangled even if no function is.
      package-average: 6
    decorder:
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
      disable-type-dec-num-check: false
      disable-const-dec-num-check: false
      disable-var-dec-num-check: false
    depguard:
      rules:
        allowed-imports:
          # Anything outside this list is a dependency decision: add it here together with go.mod,
          # THIRD_PARTY_NOTICES.md and a license copy, and give it a boundary rule below if it belongs to one package.
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/resoltico/pdfconcat
            - github.com/pdfcpu/pdfcpu
            - github.com/benoitkugler/pdf/fonts/glyphsnames$
            - github.com/benoitkugler/pdf/fonts/simpleencodings$
            - github.com/go-text/typesetting
            - github.com/santhosh-tekuri/jsonschema/v6
            - go.yaml.in/yaml/v3
            - golang.org/x/image
            - golang.org/x/sys
            - golang.org/x/term
            - golang.org/x/text/unicode/bidi
            - golang.org/x/text
            - golang.org/x/text/cases
            - golang.org/x/text/unicode/norm
            - golang.org/x/text/encoding/charmap$
            # depguard mis-resolves go/* standard-library imports once an allowed module path begins with
            # "go."; naming the go/* packages the project uses keeps them recognised.
            - go/ast
            - go/parser
            - go/token
        # Production ownership uses exact directory selectors and exact imported-package permissions.
        # More-specific allows override the module denial within this same native depguard rule.
        # Independent _test.go internal imports are deliberately unrestricted; the $all external
        # allowlist and library ownership checks still apply. Non-test support files are classified
        # explicitly below, and runtime owners cannot import them.
        production-assembly:
          list-mode: lax
          files:
            - "**/internal/assembly/*.go"
            - "!$test"
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-typeset:
          list-mode: lax
          files:
            - "**/internal/typeset/*.go"
            - "!$test"
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-capture:
          list-mode: lax
          files:
            - "**/internal/capture/*.go"
            - "!$test"
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-plan:
          list-mode: lax
          files:
            - "**/internal/plan/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/assembly$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-layout:
          list-mode: lax
          files:
            - "**/internal/layout/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/assembly$
            - github.com/resoltico/pdfconcat/internal/typeset$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-genpage:
          list-mode: lax
          files:
            - "**/internal/genpage/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/typeset$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-pdfengine:
          list-mode: lax
          files:
            - "**/internal/pdfengine/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/capture$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-publish:
          list-mode: lax
          files:
            - "**/internal/publish/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/capture$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-report:
          list-mode: lax
          files:
            - "**/internal/report/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/assembly$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-cli:
          list-mode: lax
          files:
            - "**/internal/cli/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/assembly$
            - github.com/resoltico/pdfconcat/internal/report$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
            - pkg: os
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: syscall
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: net
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: log
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: io/ioutil
              desc: computational packages receive values and abstract I/O, not process or filesystem state
            - pkg: plugin
              desc: computational packages receive values and abstract I/O, not process or filesystem state
        production-app:
          list-mode: lax
          files:
            - "**/internal/app/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/assembly$
            - github.com/resoltico/pdfconcat/internal/capture$
            - github.com/resoltico/pdfconcat/internal/cli$
            - github.com/resoltico/pdfconcat/internal/genpage$
            - github.com/resoltico/pdfconcat/internal/layout$
            - github.com/resoltico/pdfconcat/internal/pdfengine$
            - github.com/resoltico/pdfconcat/internal/plan$
            - github.com/resoltico/pdfconcat/internal/publish$
            - github.com/resoltico/pdfconcat/internal/report$
            - github.com/resoltico/pdfconcat/internal/typeset$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-command:
          list-mode: lax
          files:
            - "**/cmd/pdfconcat/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/app$
            - github.com/resoltico/pdfconcat/internal/pdfengine$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-support:
          list-mode: lax
          files:
            - "**/internal/exectest/*.go"
            - "**/internal/pdffixture/*.go"
            - "**/internal/pdforacle/*.go"
            - "**/internal/permissiontest/*.go"
            - "**/internal/repopolicy/*.go"
            - "!$test"
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-installtools:
          list-mode: lax
          files:
            - "**/tools/installtools/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/repopolicy$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-qualitygate:
          list-mode: lax
          files:
            - "**/tools/qualitygate/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/repopolicy$
            - github.com/resoltico/pdfconcat/internal/capture$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-scale:
          list-mode: lax
          files:
            - "**/test/scale/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/exectest$
            - github.com/resoltico/pdfconcat/internal/pdffixture$
            - github.com/resoltico/pdfconcat/internal/pdforacle$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        production-decoder-fixture:
          list-mode: lax
          files:
            - "**/internal/plan/testdata/decodecmd/*.go"
            - "!$test"
          allow:
            - github.com/resoltico/pdfconcat/internal/plan$
          deny:
            - pkg: github.com/resoltico/pdfconcat
              desc: internal imports must follow this production owner
        bidi-boundary:
          list-mode: lax
          files:
            - "!**/internal/typeset/*.go"
          deny:
            - pkg: golang.org/x/text/unicode/bidi
              desc: Unicode direction classification belongs to typeset
        terminal-boundary:
          list-mode: lax
          files:
            - "!**/cmd/pdfconcat/*.go"
          deny:
            - pkg: golang.org/x/term
              desc: terminal detection belongs to cmd/pdfconcat
        process-effects-boundary:
          list-mode: lax
          files:
            - "!$test"
            - "!**/cmd/pdfconcat/*.go"
            - "!**/tools/installtools/*.go"
            - "!**/tools/qualitygate/*.go"
            - "!**/internal/exectest/*.go"
            - "!**/internal/plan/testdata/decodecmd/*.go"
          deny:
            - pkg: log
              desc: default process logging belongs to executable wiring or explicit test tooling
            - pkg: os/signal
              desc: process signals belong to executable wiring or explicit test tooling
        engine-boundary:
          # docs/ARCHITECTURE.md: pdfcpu details live in internal/pdfengine and never leak across the application.
          list-mode: lax
          files:
            - "!**/internal/pdfengine/*.go"
            - "!**/internal/pdfengine/**/*.go"
          deny:
            - pkg: github.com/pdfcpu/pdfcpu
              desc: pdfcpu may only be imported by internal/pdfengine
            - pkg: github.com/benoitkugler/pdf/fonts
              desc: PDF glyph encoding tables belong to internal/pdfengine
        typesetting-boundary:
          # Text shaping is internal/typeset's concern; other packages use its API.
          list-mode: lax
          files:
            - "!**/internal/typeset/*.go"
          deny:
            - pkg: github.com/go-text/typesetting
              desc: the shaping library may only be imported by internal/typeset
            - pkg: golang.org/x/image
              desc: golang.org/x/image may only be imported by internal/typeset
        platform-boundary:
          # Raw OS interfaces: file publication, source capture, the process shell and the scale harness.
          list-mode: lax
          files:
            - "!**/internal/publish/*.go"
            - "!**/internal/capture/*.go"
            - "!**/internal/app/*.go"
            - "!**/internal/permissiontest/*.go"
            - "!**/cmd/pdfconcat/*.go"
            - "!**/test/scale/*.go"
          deny:
            - pkg: golang.org/x/sys
              desc: OS-specific syscalls belong to publish, capture, app, permissiontest, cmd and the scale harness
        schema-validator-tests-only:
          # The JSON Schema validator is an independent oracle for tests, never runtime code.
          list-mode: lax
          files:
            - "!$test"
          deny:
            - pkg: github.com/santhosh-tekuri/jsonschema
              desc: the JSON Schema validator may only be imported by tests
        policy-tooling:
          # The YAML reader exists for the quality-policy tooling only; the product reads JSON.
          list-mode: lax
          files:
            - "!**/internal/repopolicy/*.go"
            - "!**/tools/**/*.go"
          deny:
            - pkg: go.yaml.in/yaml/v3
              desc: YAML is read only by internal/repopolicy and tools/
    errcheck:
      disable-default-exclusions: true
      exclude-functions:
        - (*strings.Builder).WriteRune
        - (*strings.Builder).WriteString
        - (*bytes.Buffer).Write
        - (*bytes.Buffer).WriteString
        - fmt.Fprintf(*strings.Builder)
        - fmt.Fprintf(*bytes.Buffer)
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: false
      check:
        - switch
        - map
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: write to an injected io.Writer; only cmd/pdfconcat touches the process streams
        - pattern: ^os\.(Stdout|Stderr|Stdin)$
          msg: process streams are wired in cmd/pdfconcat and injected
    funlen:
      # Roughly one screen; the defaults of 60 lines and 40 statements.
      lines: 60
      statements: 40
    gochecksumtype:
      default-signifies-exhaustive: false
    gocognit:
      # SonarSource's recommended ceiling for cognitive complexity.
      min-complexity: 15
    goconst:
      ignore-calls: false
      exclude-types: []
      min-len: 3
      min-occurrences: 3
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
      settings:
        hugeParam:
          # Copying up to 256 bytes (four cache lines) is negligible next to the PDF work done per call.
          sizeThreshold: 256
    gocyclo:
      min-complexity: 12
    godoclint:
      default: all
      disable:
        - require-doc
      options:
        max-len:
          # Matches lll and golines, so the formatter and the linters agree.
          length: 140
    godot:
      # Declaration comments must be full sentences. The licence header is a fixed template that
      # goheader enforces, so file-level comments are deliberately outside this linter's scope.
      scope: declarations
    goheader:
      template: |-
        SPDX-License-Identifier: MPL-2.0
        Copyright (c) 2026 Ervins Strauhmanis
    gomoddirectives:
      replace-allow-list: []
      retract-allow-no-explanation: false
    gosec:
      severity: low
      confidence: low
    govet:
      enable-all: true
      settings:
        shadow:
          strict: true
    iface:
      enable:
        - identical
        - unused
        - opaque
    interfacebloat:
      max: 5
    lll:
      # Matches golines' max-len below, so the formatter and the linter agree.
      line-length: 140
      tab-width: 4
    maintidx:
      under: 25
    mnd:
      ignored-numbers:
        - "2"
    nakedret:
      max-func-lines: 0
    nestif:
      min-complexity: 4
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    paralleltest:
      ignore-missing: false
      ignore-missing-subtests: false
    perfsprint:
      strconcat: true
    prealloc:
      simple: false
      range-loops: true
      for-loops: true
    predeclared:
      qualified-name: true
    revive:
      confidence: 0
      enable-all-rules: true
      rules:
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: function-length
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: file-length-limit
          disabled: true
          arguments:
            - max: 1000
              skipComments: true
              skipBlankLines: true
        - name: max-public-structs
          disabled: true
          arguments: [20]
        - name: banned-characters
          arguments: [" ", "﻿", "​"]
        - name: add-constant
          disabled: true
        - name: confusing-results
          disabled: true
        - name: unhandled-error
          disabled: true
    staticcheck:
      checks: ["all"]
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    testpackage:
      skip-regexp: (export|internal)_test\.go
    thelper:
      test:
        first: true
        name: true
        begin: true
    unparam:
      check-exported: true
    unused:
      parameters-are-used: true
      field-writes-are-uses: false
      post-statements-are-reads: false
      exported-fields-are-used: false
      local-variables-are-used: false
      generated-is-used: false
    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      os-temp-dir: true
    varnamelen:
      min-name-length: 3
      # A short name is clear while its declaration is in view; beyond 15 lines (a quarter of funlen's
      # 60-line limit) it needs a descriptive one.
      max-distance: 15
      ignore-names:
        - tc
        - tt
        - id
      ignore-decls:
        - t *testing.T
        - b *testing.B
        - f *testing.F
        - tb testing.TB
        - w io.Writer
        - r io.Reader
    whitespace:
      multi-if: false
      multi-func: false
    wrapcheck:
      ignore-package-globs:
        - github.com/resoltico/pdfconcat/*
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

  exclusions:
    # Nothing is excluded implicitly: no presets, and generated files are linted like any other.
    generated: disable
    warn-unused: true
    presets: []
    rules:
      - linters:
          - gosec
        path: ^tools/qualitygate/process\.go$
        source: exec\.CommandContext\(ctx, c\.name, c\.args\.\.\.\)
        text: 'G204: Subprocess launched with a potential tainted input'
      - linters:
          - gosec
        path: ^tools/installtools/main\.go$
        source: exec\.CommandContext\(ctx, "go", "install"
        text: 'G204: Subprocess launched with a potential tainted input'
      - linters:
          - gosec
        path: ^tools/installtools/main\.go$
        source: exec\.CommandContext\(ctx, github, "release", "verify-asset"
        text: 'G204: Subprocess launched with variable'
      - linters:
          - gosec
        path: ^internal/exectest/exectest\.go$
        source: exec\.CommandContext\(tb\.Context\(\), "go"
        text: 'G204: Subprocess launched with a potential tainted input'
      - linters:
          - gosec
        path: ^internal/exectest/exectest\.go$
        source: exec\.CommandContext\(tb\.Context\(\), "go"
        text: 'G702: Command injection via taint analysis'
      - linters:
          - gosec
        path: ^internal/exectest/exectest\.go$
        source: exec\.CommandContext\(ctx, path, args\.\.\.\)
        text: 'G204: Subprocess launched with variable'
      - linters:
          - gochecknoglobals
        path: ^internal/exectest/exectest\.go$
        text: cache is a global variable
      - linters:
          - usetesting
        path: ^internal/exectest/exectest\.go$
        source: os\.MkdirTemp\("", "exectest-"\)
        text: os\.MkdirTemp\(\) could be replaced by tb\.TempDir\(\)
      - linters:
          - gosec
        path: ^internal/doccontract/examples_test\.go$
        source: exec\.CommandContext\(t\.Context\(\), interpreter, "-m", "py_compile", script\)
        text: 'G204: Subprocess launched with variable'
      - linters:
          - forbidigo
        path: ^cmd/pdfconcat/main\.go$
        source: Stdin:\s+os\.Stdin
        text: use of `os\.Stdin` forbidden
      - linters:
          - forbidigo
        path: ^cmd/pdfconcat/main\.go$
        source: Stdout:\s+os\.Stdout
        text: use of `os\.Stdout` forbidden
      - linters:
          - forbidigo
        path: ^cmd/pdfconcat/main\.go$
        source: os\.Stderr
        text: use of `os\.Stderr` forbidden
      - linters:
          - gosec
        path: ^internal/pdforacle/tools\.go$
        source: exec\.CommandContext\(context\.Background\(\), program, args\.\.\.\)
        text: 'G204: Subprocess launched with variable'
      - linters:
          - gosec
        path: ^test/scale/measure_windows\.go$
        source: GetProcessHandleCount
        text: 'G103: Use of unsafe calls should be audited'
      - linters:
          - gosec
        path: ^test/scale/measure_windows\.go$
        source: Call\(uintptr\(s\.handle\), uintptr\(unsafe\.Pointer\(&counters\)\), uintptr\(counters\.Cb\)\)
        text: 'G103: Use of unsafe calls should be audited'
      - linters:
          - errcheck
        path: ^internal/genpage/write\.go$
        source: _, _ = d\.flate\.Write\(data\)
        text: Error return value of `d\.flate\.Write` is not checked
      - linters:
          - errcheck
