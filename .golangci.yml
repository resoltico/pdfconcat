formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: disable
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/resoltico/pdfconcat)
      custom-order: true
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/resoltico/pdfconcat
    golines:
      max-len: 140
      tab-len: 4
      shorten-comments: false
