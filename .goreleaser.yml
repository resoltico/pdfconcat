# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.18.2/www/static/schema.json
version: 2

project_name: PDFConcat

report_sizes: true

before:
  hooks:
    - go run ./tools/qualitygate release-version -tag={{ .Tag }} -snapshot={{ .IsSnapshot }}

snapshot:
  version_template: '{{ mustReadFile "internal/app/version.txt" | trim }}-SNAPSHOT-{{ .ShortCommit }}'

builds:
  - id: pdfconcat
    main: ./cmd/pdfconcat
    binary: pdfconcat
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - src: third_party/licenses/*
        dst: third_party/licenses
        strip_parent: true
      - src: docs/CLI.md
        dst: docs/CLI.md
      - src: docs/PLAN.md
        dst: docs/PLAN.md
      - src: docs/BLANK_PAGES.md
        dst: docs/BLANK_PAGES.md
      - src: internal/**/*.schema.json
        dst: schemas
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

# Retained configuration for future binary releases stages packages as a draft.
# The current source-only release workflow publishes changelog notes without invoking GoReleaser.
release:
  draft: true
  replace_existing_draft: true
  prerelease: auto
  preflight:
    fail_on_error: true
