# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.18.2/www/static/schema.json
version: 2

project_name: PDFConcat

builds:
  - id: pdfconcat
    main: ./cmd/pdfconcat
    binary: pdfconcat
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.commitDate={{ .CommitDate }}

gomod:
  proxy: true

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md
      - src: third_party/licenses/*
        dst: third_party/licenses

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
  preflight:
    fail_on_error: true
