# The one registry of exceptions to the project's automated quality gates: golangci-lint, statement
# coverage, and mutation testing. Nothing is excepted anywhere else: no inline `//nolint`, no
# exclusion lists in .golangci.yml of its own, no hand-written coverage or mutation skip lists.
#
# Every entry carries
#   id                 a stable, meaningful identifier (lower-case words joined by hyphens)
#   tool               golangci-lint, coverage, or mutation
#   kind               why the exception is legitimate (the allowed kinds depend on the tool)
#   retained_property  what stays protected despite the exception
# plus the fields its tool needs, and a YAML comment immediately above the entry that says why
# repairing the code or the rule is inappropriate. That comment is the rationale; it is checked
# for presence, and it is the only place the rationale is written.
#
# Enforcement (see CONTRIBUTING.md, "Exceptions"):
#   go run ./tools/qualitygate lint-config   .golangci.yml must carry exactly these lint exceptions
#   go run ./tools/qualitygate lint-stale    each lint diagnostic exclusion must still match a real diagnostic
#   go run ./tools/qualitygate coverage      applies the coverage entries and the threshold below
#   go run ./tools/qualitygate mutation      applies the mutation entries
version: 1

# Require every reachable statement in packages linked into the executable. The denominator merges
# uncached unit tests and instrumented subprocess execution; only exact, defended entries below may
# exclude an unreachable or native-platform statement. Report raw coverage separately.
coverage_threshold_percent: 100

exceptions:
  # This startup-failure control uses only an owned missing path or fixed true
  # executable with an already-canceled context. A real native Start failure proves
  # prepared collector cleanup; no shell, arguments or user executable is accepted.
  - id: lint-scale-native-failed-setup-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: test/scale/measure_setup_darwin_internal_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'fixture, err := startOwnedCollectorProcess\(t, exec\.CommandContext\(ctx, executable\)\)'
    goos: darwin
    retained_property: real failed process startup releases its owned native collector resources

  # This test starts only its owned native child, compiled from fixed embedded
  # source by the verified compiler. The real stopped/live zero-FD boundary needs
  # a separate process; no shell, arguments or user executable are accepted.
  - id: lint-scale-native-zero-child-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: test/scale/measure_zero_darwin_internal_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'fixture := ownCollectorProcess\(t, exec\.CommandContext\(ctx, binary\)\)'
    goos: darwin
    retained_property: actual stopped zero-descriptor child retains bounded owned-process lifecycle and native evidence

  # This private parent uses its current executable, fixed selector and owned
  # coverage arguments to prove a real completed write joins cancellation. A
  # process boundary contains ForkLock/descriptor state; no shell is accepted.
  - id: lint-progress-native-join-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_join_darwin_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressJoinSelector, progressNativeVerbose\)\.\.\.\)'
    goos: darwin
    retained_property: real native completion and cancellation remain attributable within a bounded private process

  # This bounded parent invokes its current executable with an exact private
  # selector and owned coverage arguments. The process boundary contains actual
  # descriptor retirement and ForkLock ownership; no shell or user command exists.
  - id: lint-progress-native-protection-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_protection_darwin_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressProtectionSelector, progressVerboseHelperArgument\)\.\.\.\)'
    goos: darwin
    retained_property: real native finalization failure has bounded private-process ownership and attributable results

  # Only this isolated child retires the raw cancellation descriptor and checks
  # native vacancy. Parallel test scheduling would weaken the descriptor-reuse
  # observation; the ordinary parent still runs in parallel.
  - id: lint-progress-native-protection-helper-sequential
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: paralleltest
    path: cmd/pdfconcat/progress_transport_protection_darwin_test.go
    message: Function TestProgressNativeProtectionHelper missing the call to method parallel
    source: func TestProgressNativeProtectionHelper\(t \*testing\.T\) \{
    goos: darwin
    retained_property: actual retired-target finalization runs without parallel descriptor scheduling

  # These bounded parents invoke their current test executable with a fixed
  # private selector and verbose/owned coverage arguments. Checked scenario
  # values select real native controls; no shell or user command is accepted.
  - id: lint-progress-linux-failure-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_linux_failure_test.go
    message: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
    source: 'command := exec\.CommandContext\('
    goos: linux
    retained_property: actual private acquisition and wait failures retain bounded ownership and execution evidence

  # The Darwin parent needs a private child to contain actual pipe/PTY ownership
  # changes. Its current executable and fixed selector admit no external command;
  # replacing this real process boundary would weaken lifecycle verification.
  - id: lint-progress-darwin-phase-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_phase_darwin_test.go
    message: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressPhaseSelector, progressNativeVerbose\)\.\.\.\)'
    goos: darwin
    retained_property: anchored private native phase controls preserve real descriptors and bounded lifecycle

  # This parent invokes only its current test executable and an anchored private
  # scenario selector. Actual child PASS, receipt, successful exit and watchdog
  # establish execution; no shell or user-supplied command is accepted.
  - id: lint-progress-relocation-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_relocation_boundary_unix_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressRelocationSelector, progressVerboseHelperArgument\)\.\.\.\)'
    retained_property: anchored private native helper retains bounded lifecycle and attributable execution

  # The isolated child retires stdin and observes raw descriptor vacancy before
  # handing acquired ownership to the production finalizer. Test parallel
  # scheduling would weaken that real descriptor-reuse observation.
  - id: lint-progress-relocation-helper-sequential
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: paralleltest
    path: cmd/pdfconcat/progress_relocation_boundary_unix_test.go
    message: Function TestProgressRelocationBoundaryHelper missing the call to method parallel
    source: func TestProgressRelocationBoundaryHelper\(t \*testing\.T\) \{
    retained_property: private native retirement and ownership handoff run without parallel test scheduling

  # This native policy test runs only the current executable and an anchored
  # private scenario selector with verbose and owned coverage-directory arguments.
  # Successful exit, actual helper PASS, scenario receipt and watchdog are required.
  - id: lint-progress-native-zero-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_zero_policy_linux_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressZeroSelector, progressVerboseHelperArgument\)\.\.\.\)'
    goos: linux
    retained_property: exact private-child native controls preserve bounded lifecycle and attributable results

  # The real constructor has already bounded this independently owned descriptor
  # to signed 32-bit native FD range and the test rejects standard/caller slots.
  # The BPF word intentionally represents that same FD on the reviewed little-endian
  # Linux amd64/arm64 ABI; no unrelated numeric narrowing is exempted.
  - id: lint-progress-native-zero-filter-descriptor-word
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_zero_policy_linux_test.go
    message: 'G115: integer overflow conversion int -> uint32'
    source: '\{Code: unix\.BPF_JMP \| unix\.BPF_JEQ \| unix\.BPF_K, K: uint32\(owned\), Jf: 1\},'
    goos: linux
    retained_property: native FD identity and reviewed filter branching preserve caller and diagnostic writes

  # The producer parent runs only os.Executable with the exact private selector,
  # verbose flag and owned coverage-directory arguments. A bounded child, scenario
  # receipt and actual PASS/exit are required; no shell or user executable is selected.
  - id: lint-progress-native-producer-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_producer_windows_test.go
    message: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressProducerSelector, "-test\.v"\)\.\.\.\)'
    goos: windows
    retained_property: actual private producer scenarios and joined cleanup are proved without selectable commands

  # This one private helper observes its genuinely inherited process stderr handle.
  # Wrapping another handle would not test inheritance. It borrows through SyscallConn,
  # does not replace standard handles or call Fd, and the parent drains and joins it.
  - id: lint-progress-native-producer-inherited-stderr
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: cmd/pdfconcat/progress_producer_windows_test.go
    message: 'use of `os\.Stderr` forbidden'
    source: 'source := os\.Stderr'
    goos: windows
    retained_property: genuine inherited-handle admission preserves caller configuration and process ownership

  # The class 16 information query is always synchronous, even on async handles. Its four-byte
  # scalar output and status block are independently pinned/retained through return. Exact native
  # success, Information == 4 and synchronous mode are required.
  - id: lint-progress-pipe-mode-native-buffer
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_pipe_windows.go
    message: 'G103: Use of unsafe calls should be audited'
    source: 'queryErr := windows\.NtQueryInformationFile\(handle, &status, \(\*byte\)\(unsafe\.Pointer\(&mode\)\), fileModeBytes, fileModeInformation\)'
    goos: windows
    retained_property: scalar pinning and exact native payload qualification preserve caller ownership

  # This class 4 call borrows the same positively qualified synchronous original file object. The
  # independent eight-byte output and sixteen-byte status block are pinned/retained, with checked
  # Windows64 sizes and Information offset eight. Both pointer expressions belong to this exact
  # five-argument call; unfinished-query ownership is not claimed.
  - id: lint-progress-pipe-backend-native-buffers
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_pipe_windows.go
    message: 'G103: Use of unsafe calls should be audited'
    source: 'returned, _, _ := query\.Call\(uintptr\(handle\), uintptr\(unsafe\.Pointer\(&status\)\), uintptr\(unsafe\.Pointer\(&device\)\),'
    goos: windows
    retained_property: checked native ABI and synchronous scalar-buffer lifetime precede owned duplication

  # NtQueryVolumeInformationFile reports errors through the returned NTSTATUS, explicitly checked
  # for exact STATUS_SUCCESS. LazyProc.Call GetLastError is not authoritative for this routine and
  # must not replace the actual native failure.
  - id: lint-progress-pipe-backend-status-authority
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: errcheck
    path: cmd/pdfconcat/progress_pipe_windows.go
    message: 'Error return value of `query\.Call` is not checked'
    source: 'returned, _, _ := query\.Call\(uintptr\(handle\), uintptr\(unsafe\.Pointer\(&status\)\), uintptr\(unsafe\.Pointer\(&device\)\),'
    goos: windows
    retained_property: exact native status and payload checks retain real failures before admission

  # NTSTATUS is a native 32-bit return carried in uintptr. Taking its low word is the intended ABI
  # operation, including sign-extended failures. Numeric range rejection would misinterpret them;
  # exact zero admits and every nonzero native status is retained.
  - id: lint-progress-pipe-backend-status-word
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_pipe_windows.go
    message: 'G115: integer overflow conversion uintptr -> uint32'
    source: 'code := windows\.NTStatus\(returned\)'
    goos: windows
    retained_property: native low-word status semantics preserve exact success and failure classification

  # This private native Linux helper installs exactly nine reviewed instructions on its
  # locked thread. Both SockFprog and its filter array are pinned and kept alive through
  # the synchronous kernel copy; no native pointer survives the syscall.
  - id: lint-progress-private-close-policy-native-program
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_seccomp_linux_test.go
    message: 'G103: Use of unsafe calls should be audited'
    source: '_, _, errno := unix\.Syscall6\(unix\.SYS_PRCTL, unix\.PR_SET_SECCOMP, unix\.SECCOMP_MODE_FILTER, uintptr\(unsafe\.Pointer\(&program\)\), 0, 0, 0\)'
    goos: linux
    retained_property: pinned native ABI and private locked-thread lifetime preserve memory and policy ownership

  # Only the current test executable and the fixed close-policy helper selector are
  # launched, with a bounded context and an exact scenario environment. No shell or
  # user-selected command participates in this real constructor-failure control.
  - id: lint-progress-private-close-policy-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_close_policy_linux_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressClosePolicySelector, progressVerboseHelperArgument\)\.\.\.\)'
    goos: linux
    retained_property: actual private-process refusal and cleanup are required without changing parent policy

  # The native sandbox fixture runs only the current test executable and one fixed selector.
  # Verbose output and the owned coverage-directory prefix supply receipts, not user commands.
  # Real process isolation is required because the applied kernel policy is irreversible.
  - id: lint-progress-native-sandbox-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_sandbox_darwin_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressSandboxSelector, progressNativeVerbose\)\.\.\.\)'
    goos: darwin
    retained_property: actual private-process kernel refusal and cleanup are proved without changing parent policy

  # This child uses os.Executable with fixed signal test/verbose flags and one owned atomic
  # coverage directory. No shell or executable/selector from user input is involved; separate
  # processes keep temporary native signal disposition and each retry counter attributable.
  - id: lint-progress-native-signal-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_signal_darwin_test.go
    message: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
    source: 'command := exec\.CommandContext\(ctx, executable, progressSignalSelector, progressNativeVerbose, "-test\.gocoverdir="\+directory\)'
    goos: darwin
    retained_property: each actual native signal scenario has isolated lifecycle and original counter evidence

  # LookPath chooses the installed Go tool, whose version/platform must match this compiled
  # test's runtime. This fixed version invocation validates that prerequisite before conversion;
  # no shell or selectable operation is accepted.
  - id: lint-progress-native-coverage-tool-version
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_signal_coverage_darwin_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, tool, "version"\)'
    goos: darwin
    retained_property: native child coverage is decoded by the same verified SDK and platform

  # The verified Go tool executes only covdata textfmt with fixed flags and owned input/output
  # paths. The conversion preserves original metadata and counters; an invented profile cannot
  # replace this actual child-specific EINTR receipt.
  - id: lint-progress-native-coverage-tool-conversion
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_signal_coverage_darwin_test.go
    message: 'G204: Subprocess launched with variable'
    source: 'command := exec\.CommandContext\(ctx, tool, "tool", "covdata", "textfmt", "-i="\+directory, "-o="\+profile\)'
    goos: darwin
    retained_property: original per-child atomic counters prove the actual retry branch before merging

  # The authoritative coverage gate supplies an owned evidence root. Each unique scenario
  # directory must live there to retain original child metadata after test.TempDir cleanup;
  # without that gate root the fixture already uses the testing-owned temporary directory.
  - id: lint-progress-native-child-coverage-evidence-directory
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: usetesting
    path: cmd/pdfconcat/progress_transport_signal_coverage_darwin_test.go
    message: 'os\.MkdirTemp\(\) could be replaced by t\.TempDir\(\) in progressSignalCoverDirectory'
    source: 'directory, err := os\.MkdirTemp\(root, "native-signal-"\+scenario\+"-"\)'
    goos: darwin
    retained_property: each real child profile remains attributable and recoverable after the test finishes

  # Successful native open/duplicate producers return a nonnegative C-int descriptor; failed
  # admission returns first. Keep this owned-descriptor range backstop for future ABI changes.
  # Caller-range rejection remains real and independently tested; this is only the admitted sink.
  - id: coverage-progress-owned-native-range-darwin
    tool: coverage
    kind: unreachable-branch
    path: cmd/pdfconcat/progress_transport_unix.go
    function: newProgressTransport
    anchor: 'return nil, errors.Join(errProgressDescriptorRange, unix.Close(sink.fd))'
    goos: darwin
    retained_property: a future out-of-range owned sink is closed and refused before native polling

  # Constructor nil rejection precedes this helper. Go1.27.2 File.SyscallConn checks only the
  # File pointer, then newRawConn unconditionally returns nil error. Closed/native-bad files fail
  # later RawControl, which stays covered; no artificial nil helper caller supplies this branch.
  - id: coverage-progress-admitted-syscall-connection-darwin
    tool: coverage
    kind: unreachable-branch
    path: cmd/pdfconcat/progress_transport_unix.go
    function: nativeProgressDescriptor
    anchor: 'return 0, fmt.Errorf("access stderr descriptor: %w", err)'
    goos: darwin
    retained_property: any future native connection API failure prevents borrowing or mutating caller descriptors

  # Successful native open/duplicate producers return a nonnegative C-int descriptor; failed
  # admission returns first. Keep this owned-descriptor range backstop for future ABI changes.
  # Caller-range rejection remains real and independently tested; this is only the admitted sink.
  - id: coverage-progress-owned-native-range-linux
    tool: coverage
    kind: unreachable-branch
    path: cmd/pdfconcat/progress_transport_unix.go
    function: newProgressTransport
    anchor: 'return nil, errors.Join(errProgressDescriptorRange, unix.Close(sink.fd))'
    goos: linux
    retained_property: a future out-of-range owned sink is closed and refused before native polling

  # Constructor nil rejection precedes this helper. Go1.27.2 File.SyscallConn checks only the
  # File pointer, then newRawConn unconditionally returns nil error. Closed/native-bad files fail
  # later RawControl, which stays covered; no artificial nil helper caller supplies this branch.
  - id: coverage-progress-admitted-syscall-connection-linux
    tool: coverage
    kind: unreachable-branch
    path: cmd/pdfconcat/progress_transport_unix.go
    function: nativeProgressDescriptor
    anchor: 'return 0, fmt.Errorf("access stderr descriptor: %w", err)'
    goos: linux
    retained_property: any future native connection API failure prevents borrowing or mutating caller descriptors

  # Successful F_GETPATH constructs and copies a MAXPATHLEN-bounded path including its trailing
  # NUL into this pinned initialized buffer. Keep malformed-success defense for future kernel/API
  # changes; actual F_GETPATH errors remain reachable and are not excluded. Published XNU/API
  # contract review is not a claim that the installed kernel was built from that source revision.
  - id: coverage-progress-successful-terminal-path-terminator-darwin
    tool: coverage
    kind: unreachable-branch
    path: cmd/pdfconcat/progress_transport_darwin.go
    function: progressTerminalPath
    anchor: 'return "", errProgressTerminalPath'
    goos: darwin
    retained_property: malformed native terminal paths cannot be reopened as owned telemetry descriptors

  # These native Poll resource controls run only os.Executable's current test binary with a
  # fixed helper selector and -test.v. The sole optional extra argv item is the owned prefixed
  # coverage directory; no shell or user command is involved. Process isolation is necessary to
  # lower the actual FD limit after runtime startup without changing the parent process.
  - id: lint-progress-native-poll-limit-helper-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_poll_darwin_test.go
    message: 'G204: Subprocess launched with a potential tainted input or cmd arguments'
    source: 'command := exec\.CommandContext\(ctx, executable, progressHelperArgs\(progressPollLimitSelector, progressNativeVerbose\)\.\.\.\)'
    goos: darwin
    retained_property: actual post-runtime kernel Poll failure is exercised with bounded owned-child cleanup

  # Darwin dev_t is signed; this conversion encodes native identity modulo 2^64, exactly matching
  # the launcher's C(uintmax_t) stat field including negative values. It is not size arithmetic.
  # Rejecting negative device IDs would change identity semantics; the owned file's full stat and
  # digest are checked independently before the verified same-process launch.
  - id: lint-scale-native-device-identity-word
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: test/scale/descriptor_identity_darwin.go
    message: 'G115: integer overflow conversion int32 -> uint64'
    source: 'return uint64\(stat\.Dev\)'
    goos: darwin
    retained_property: native signed device identity preserves every bit in the matching preparation record

  # This private exec fixture must read real inherited stdin to prove stdio survives kernel exec
  # hygiene while the original attestation pipe reaches EOF. Injected readers cannot prove native
  # descriptor inheritance; the parent uses owned subprocess pipes and checked release/cleanup.
  - id: lint-scale-exec-fixture-native-stdin
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: test/scale/descriptor_launch_unix_internal_test.go
    message: 'use of `os\.Stdin` forbidden'
    source: 'input := bufio\.NewReader\(os\.Stdin\)'
    retained_property: actual inherited stdin delivers the live-child and release witnesses

  # The private initialized child writes this exact witness to inherited stderr; replacing it
  # with an injected writer would not establish that same-process exec preserved descriptor2.
  - id: lint-scale-exec-fixture-native-stderr
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: test/scale/descriptor_launch_unix_internal_test.go
    message: 'use of `os\.Stderr` forbidden'
    source: 'if _, err = fmt\.Fprintln\(os\.Stderr, "stderr after exec"\); err != nil \{'
    retained_property: actual stderr inheritance is witnessed with checked native output

  # This stdout acknowledgement proves the same initialized child remains alive after original
  # control-pipe EOF. A mock or a descriptor-number check cannot establish that ordering because
  # Go may reuse descriptor3 for its own runtime poller after exec.
  - id: lint-scale-exec-fixture-native-stdout
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: test/scale/descriptor_launch_unix_internal_test.go
    message: 'use of `os\.Stdout` forbidden'
    source: 'if _, err = fmt\.Fprintln\(os\.Stdout, "alive after exec"\); err != nil \{'
    retained_property: actual stdout acknowledgement establishes live-child ordering and inheritance

  # This test-only context decorator retains the actual WithCancel base so Deadline/Done/Value
  # and Err remain one consistent context. Method closures or manufactured sentinel errors would
  # hide that ownership and violate the independently reviewed cancellation-fixture contract.
  - id: lint-pdfengine-checkpoint-context-base
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: containedctx
    path: internal/pdfengine/context_checkpoint_internal_test.go
    message: 'found a struct that contains a context\.Context field'
    source: 'context\.Context'
    retained_property: real cancellation closes the same delegated Done channel and preserves parent values and deadlines

  # Context.Err must return its exact base error, not a wrapped substitute. This actual cancellable
  # test decorator invokes CancelFunc at a checkpoint and then delegates Err; wrapping the result
  # would change the context interface contract rather than improve error provenance.
  - id: lint-pdfengine-checkpoint-context-error-contract
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: wrapcheck
    path: internal/pdfengine/context_checkpoint_internal_test.go
    message: 'error returned from interface method should be wrapped: sig: func \(context\.Context\)\.Err\(\) error'
    source: 'return c\.Context\.Err\(\)'
    retained_property: exact sticky context cancellation/deadline errors remain consistent with the delegated lifecycle

  # Darwin TIOCPTYGNAME requires a 128-byte output pointer; x/sys exposes no typed name getter.
  # On both supported Darwin64 architectures IoctlSetInt preserves the pinned address through its
  # uintptr libSystem ioctl carrier. The synchronous call has KeepAlive, bounded NUL validation and
  # no escaping pointer. Replacing it with deprecated raw SYS_IOCTL would bypass the maintained ABI.
  - id: lint-progress-native-pty-name-buffer
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: cmd/pdfconcat/progress_transport_pty_darwin_test.go
    message: 'G103: Use of unsafe calls should be audited'
    source: 'err := unix\.IoctlSetInt\(master, unix\.TIOCPTYGNAME, int\(uintptr\(unsafe\.Pointer\(&name\[0\]\)\)\)\)'
    goos: darwin
    retained_property: fixed pinned native output buffer and exact request ABI safely obtain the real PTY slave path

  # These post-runtime native FD-limit cases run only os.Executable's current test binary with
