    setting: linters.settings.testpackage.skip-regexp
    values: ['(export|internal)_test\.go']
    retained_property: all other tests live in external test packages

  # Each of the four revive rules below re-implements a dedicated linter that is enabled with the same
  # threshold (lll, cyclop and gocyclo, gocognit, funlen). Running both reports every finding twice and
  # lets the two thresholds drift apart; the dedicated linter owns the property.
  - id: lint-revive-disable-line-length-limit
    tool: golangci-lint
    kind: duplicate-rule
    effect: setting-item
    setting: linters.settings.revive.rules
    values: [line-length-limit]
    superseded_by: [lll]
    retained_property: lines longer than 140 characters are rejected, by lll

  # revive's cyclomatic duplicates cyclop and gocyclo, both enabled at the same limit; reporting each finding three times adds noise, not coverage.
  - id: lint-revive-disable-cyclomatic
    tool: golangci-lint
    kind: duplicate-rule
    effect: setting-item
    setting: linters.settings.revive.rules
    values: [cyclomatic]
    superseded_by: [cyclop, gocyclo]
    retained_property: cyclomatic complexity above 12 is rejected, by cyclop and gocyclo

  # revive's cognitive-complexity duplicates gocognit, enabled at the same limit; the dedicated linter owns the property and one report per finding is enough.
  - id: lint-revive-disable-cognitive-complexity
    tool: golangci-lint
    kind: duplicate-rule
    effect: setting-item
    setting: linters.settings.revive.rules
    values: [cognitive-complexity]
    superseded_by: [gocognit]
    retained_property: cognitive complexity above 15 is rejected, by gocognit

  # revive's function-length duplicates funlen, enabled with the same line and statement limits; the dedicated linter owns the property and one report suffices.
  - id: lint-revive-disable-function-length
    tool: golangci-lint
    kind: duplicate-rule
    effect: setting-item
    setting: linters.settings.revive.rules
    values: [function-length]
    superseded_by: [funlen]
    retained_property: functions above 60 lines or 40 statements are rejected, by funlen

  # Revive subtracts trailing comments from its file length, allowing code-bearing physical lines
  # to evade the limit. The mandatory owned-source scanner counts physical code lines independently
  # of comments and compiler display directives, including files omitted from native compilation.
  - id: lint-revive-physical-file-length
    tool: golangci-lint
    kind: design-incompatible
    effect: setting-item
    setting: linters.settings.revive.rules
    values: [file-length-limit]
    retained_property: mandatory owned-source scan rejects every file above 1000 physical code lines

  # Revive uses byte case for Unicode names, misclassifying lowercase identifiers as exported.
  # The mandatory owned-source scanner uses Unicode exported names for all type
  # declarations; disabling this algorithm never exempts a file from the twenty-type limit.
  - id: lint-revive-exported-types
    tool: golangci-lint
    kind: design-incompatible
    effect: setting-item
    setting: linters.settings.revive.rules
    values: [max-public-structs]
    retained_property: mandatory owned-source scan rejects every file above 20 exported types

  # noinlineerr forbids `if err := f(); err != nil`, Go's standard way to keep err scoped to the
  # statement that produced it, and its autofixer has produced code that does not compile when err
  # was already declared. The project's owner policy is to keep the idiom available; shadowing is
  # covered by govet's strict shadow analyzer, which stays enabled.
  - id: lint-disable-noinlineerr
    tool: golangci-lint
    kind: design-incompatible
    effect: disable-linter
    linter: noinlineerr
    retained_property: err variables do not leak or shadow, checked by govet shadow in strict mode

  # nlreturn and wsl_v5 both police blank lines before return and branch statements with separately
  # configured block sizes; keeping both means every such statement must satisfy two differently
  # parameterized rules, and their autofixers disagree. wsl_v5 is the configurable one and stays.
  - id: lint-disable-nlreturn
    tool: golangci-lint
    kind: incompatible-rule
    effect: disable-linter
    linter: nlreturn
    conflicts_with: [wsl_v5]
    retained_property: blank-line discipline before returns and branches stays enforced by wsl_v5

  # Short names are conventional for test-table loop variables (tc, tt) and for identifiers that are
  # the whole subject of a small scope. max-distance in .golangci.yml still requires descriptive names
  # beyond 15 lines of use; these names are exempt at any distance because their meaning never changes.
  - id: lint-varnamelen-ignore-conventional-names
    tool: golangci-lint
    kind: ignored-value
    effect: setting-item
    setting: linters.settings.varnamelen.ignore-names
    values: [tc, tt, id]
    retained_property: other short names are rejected once their scope exceeds 15 lines

  # The receiver-style names of the standard interfaces and the testing handles are universal Go
  # idiom and carry no information that a longer name would add.
  - id: lint-varnamelen-ignore-conventional-declarations
    tool: golangci-lint
    kind: ignored-value
    effect: setting-item
    setting: linters.settings.varnamelen.ignore-decls
    values: [t *testing.T, b *testing.B, f *testing.F, tb testing.TB, w io.Writer, r io.Reader]
    retained_property: other short declarations are rejected once their scope exceeds 15 lines

  # The literal 2 is halving, pairing and indexing a key/value pair; naming it (half, two) reads worse
  # than the arithmetic. Every other number still needs a name.
  - id: lint-mnd-ignore-two
    tool: golangci-lint
    kind: ignored-value
    effect: setting-item
    setting: linters.settings.mnd.ignored-numbers
    values: ["2"]
    retained_property: every other magic number must be a named constant

  # wrapcheck demands wrapping errors that cross package boundaries. Errors from this module's own
  # packages are already wrapped with their operation where they are created, and re-wrapping them at
  # every layer would only repeat the same context in the message.
  - id: lint-wrapcheck-ignore-own-packages
    tool: golangci-lint
    kind: ignored-value
    effect: setting-item
    setting: linters.settings.wrapcheck.ignore-package-globs
    values: ['github.com/resoltico/pdfconcat/*']
    retained_property: errors from the standard library and third-party packages are wrapped with context

  # gosec G204 flags every exec.CommandContext whose arguments are not string literals. Running the
  # tools the gates drive (go, git, golangci-lint, gremlins, the extracted executable) with computed
  # arguments is this helper's whole purpose. The arguments come from the repository's own checked-in
  # files and flags, never from untrusted input, and the helper never goes through a shell.
  - id: lint-gosec-g204-qualitygate-process
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: tools/qualitygate/process.go
    message: "G204: Subprocess launched with a potential tainted input"
    source: exec\.CommandContext\(ctx, c\.name, c\.args\.\.\.\)
    retained_property: child processes are started directly, without a shell, from repository-controlled arguments

  # The installer runs `go install <module>@<version>` with the module and version read from the
  # checked-in tools/versions.env and its own tool table. Both are repository-controlled and the
  # command is started directly, without a shell; the Go checksum database verifies what it builds.
  - id: lint-gosec-g204-installtools-go-install
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: tools/installtools/main.go
    message: "G204: Subprocess launched with a potential tainted input"
    source: exec\.CommandContext\(ctx, "go", "install"
    retained_property: tool versions come only from the checked-in tools/versions.env and are verified by the Go checksum database

  # The attestation check runs the GitHub CLI against the path of the archive the installer just
  # downloaded into a private temporary directory, with the tag and repository from its own tool
  # table. Nothing in the arguments is attacker-controlled, and no shell is involved.
  - id: lint-gosec-g204-installtools-attestation
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: tools/installtools/main.go
    message: "G204: Subprocess launched with variable"
    source: exec\.CommandContext\(ctx, github, "release", "verify-asset"
    retained_property: only archives whose digest matches the release checksums reach the attestation check

  # exectest exists to run the freshly built executable (and `go build` to produce it) from tests, so
  # its command paths and arguments are necessarily variables. They are chosen by the test code in
  # this repository, and the commands are started directly, never through a shell.
  - id: lint-gosec-g204-exectest-build
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: internal/exectest/exectest.go
    message: "G204: Subprocess launched with a potential tainted input"
    source: exec\.CommandContext\(tb\.Context\(\), "go"
    retained_property: tests run only executables they built themselves

  # Same property as lint-gosec-g204-exectest-build, reported by gosec's taint analysis as G702.
  - id: lint-gosec-g702-exectest-build
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: internal/exectest/exectest.go
    message: "G702: Command injection via taint analysis"
    source: exec\.CommandContext\(tb\.Context\(\), "go"
    retained_property: tests run only executables they built themselves

  # Command runs the executable that Build compiled; its path is a variable by construction.
  - id: lint-gosec-g204-exectest-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: internal/exectest/exectest.go
    message: "G204: Subprocess launched with variable"
    source: exec\.CommandContext\(ctx, path, args\.\.\.\)
    retained_property: tests run only executables they built themselves

  # One executable is built per test process, not per test, because compiling it dominates the cost
  # of executable tests. That requires process-wide state, which cannot be a local variable. It is
  # guarded by a mutex and reset by Cleanup.
  - id: lint-gochecknoglobals-exectest-cache
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gochecknoglobals
    path: internal/exectest/exectest.go
    message: cache is a global variable
    retained_property: test executables are shared under a mutex and released by explicit cleanup

  # tb\\.TempDir is removed when the test that first called Build ends, which would delete the
  # executable under every later test. The directory must outlive any single test, so Build creates
  # it with os.MkdirTemp and Cleanup removes it from TestMain.
  - id: lint-usetesting-exectest-shared-directory
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: usetesting
    path: internal/exectest/exectest.go
    message: "os\\.MkdirTemp\\(\\) could be replaced by tb\\.TempDir\\(\\)"
    source: os\.MkdirTemp\("", "exectest-"\)
    retained_property: temporary directories created by tests are removed

  # The documentation test syntax-checks the recipe scripts that docs/CLI.md ships by running the
  # interpreter (python3, found on PATH) on them with `-m py_compile`. Running the interpreter is the
  # test's purpose; the script path is a temporary file the test wrote itself and no shell is involved.
  - id: lint-gosec-g204-doccontract-python-recipes
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: internal/doccontract/examples_test.go
    message: "G204: Subprocess launched with variable"
    source: exec\.CommandContext\(t\.Context\(\), interpreter, "-m", "py_compile", script\)
    retained_property: only scripts the test itself extracted are executed by the interpreter

  # cmd/pdfconcat/main.go is the one place the project's process streams are touched: it wires stdin,
  # stdout and stderr into the application, which receives them as injected readers and writers. The
  # forbidigo rule exists to keep every other package free of global streams.
  - id: lint-forbidigo-main-stdin
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: cmd/pdfconcat/main.go
    message: use of `os\.Stdin` forbidden
    source: Stdin:\s+os\.Stdin
    retained_property: no package except cmd/pdfconcat reads the process's standard input directly

  # Same reason as lint-forbidigo-main-stdin: main wires standard output into the application as an injected writer.
  - id: lint-forbidigo-main-stdout
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: cmd/pdfconcat/main.go
    message: use of `os\.Stdout` forbidden
    source: Stdout:\s+os\.Stdout
    retained_property: no package except cmd/pdfconcat writes the process's standard output directly

  # Same reason as lint-forbidigo-main-stdin, for standard error: the injected stream and the
  # terminal check that decides whether progress may be drawn on it.
  - id: lint-forbidigo-main-stderr
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: forbidigo
    path: cmd/pdfconcat/main.go
    message: use of `os\.Stderr` forbidden
    source: os\.Stderr
    retained_property: no package except cmd/pdfconcat writes the process's standard error directly

  # The oracle runs the independent QA tools (qpdf, Poppler) found on PATH with LookPath. They are
  # trusted development tools chosen by the test harness, the arguments are files the tests wrote,
  # no shell is involved, and the oracle is test infrastructure that never ships.
  - id: lint-gosec-g204-pdforacle-qa-tools
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: internal/pdforacle/tools.go
    message: "G204: Subprocess launched with variable"
    source: exec\.CommandContext\(context\.Background\(\), program, args\.\.\.\)
    retained_property: only tools resolved from PATH by name, with test-written arguments, are executed

  # golang.org/x/sys/windows has no wrapper for GetProcessHandleCount, so the scale harness calls the
  # kernel32 procedure directly and passes a pointer to a local counter. The unsafe use is one pointer
  # conversion of a stack variable for the duration of the call, in measurement code that never ships.
  - id: lint-gosec-g103-scale-handle-count
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: test/scale/measure_windows.go
    message: "G103: Use of unsafe calls should be audited"
    source: GetProcessHandleCount
    goos: windows
    retained_property: unsafe is confined to measurement code, one stack pointer per call

  # Same reason as lint-gosec-g103-scale-handle-count, for GetProcessMemoryInfo, which fills a local
  # PROCESS_MEMORY_COUNTERS structure whose address is passed to psapi.
  - id: lint-gosec-g103-scale-memory-info
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: test/scale/measure_windows.go
    message: "G103: Use of unsafe calls should be audited"
    source: Call\(uintptr\(s\.handle\), uintptr\(unsafe\.Pointer\(&counters\)\), uintptr\(counters\.Cb\)\)
    goos: windows
    retained_property: unsafe is confined to measurement code, one stack pointer per call

  # pdfengine.New fails only when pdfcpu cannot load its built-in stateless configuration, which no
  # input can influence; the same constructor failure is covered through pdfengine's own tests of New.
  - id: coverage-main-engine-construction-failure
    tool: coverage
    kind: unreachable-branch
    path: cmd/pdfconcat/main.go
    function: run
    anchor: 'return nil, fmt.Errorf("create the PDF engine: %w", engineErr)'
    retained_property: the constructor failure is wrapped with the operation that failed

  # QueryResultOf calls summaryOverhead only after ContentOf[Summary] proves that Result serializes
  # the same Summary pointer encoded separately. Summary and SavedRun are closed acyclic scalar,
  # pointer and slice structures with fixed unique JSON tags, no floats or arbitrary payloads, and
  # Encode marshals into memory with AllowInvalidUTF8. Neither encode can return an error here.
  # Retain the guard for future type/encoder changes; final encoding, sinks, malformed-report
  # rejection and envelope budgets remain checked. A fabricated unrelated Result is outside this
  # callsite invariant. Only the guarded return is excluded; the threshold and raw report stay intact.
  - id: coverage-report-summary-envelope-encoding-failure
    tool: coverage
    kind: unreachable-branch
    path: internal/report/query_result.go
    function: QueryResult.summaryOverhead
    anchor: 'return 0'
    retained_property: encoding failures remain guarded and final response encoding and sink failures remain checked

  # LoadDefaultFont parses only the fixed embedded NotoSans asset, whose digest and real parsing
  # are verified by typeset tests. No application input mutates those embedded bytes; malformed user
  # fonts use the separately tested LoadFont boundary. Retain this guard for a future invalid asset.
  - id: coverage-app-default-font-load-failure
    tool: coverage
    kind: unreachable-branch
    path: internal/app/inventory.go
    function: pipeline.loadFonts
    anchor: 'return p.stop(stageInput, err)'
    retained_property: a font failure would stop the job before any PDF is read

  # Unix identityOfOpen reads device/inode data from the preceding real-file Stat, so a FileInfo
  # without syscall metadata cannot occur. Windows queries that successfully opened, privately
  # owned source handle again; a later query failure is a native filesystem/handle fault. Real
  # source open, permission, change and close controls remain required on each native platform.
  - id: coverage-capture-identity-of-open
    tool: coverage
    kind: unreachable-branch
    path: internal/capture/snapshot.go
    function: Workspace.snapshotOpen
    anchor: 'return Captured{}, &SourceError{Path: path, Operation: "identify source", Err: err}'
    retained_property: an unavailable identity is reported as a source error naming the path

  # fsync on a regular file this package just opened read-write fails only on a device or filesystem
  # fault; the injected-operations tests cover the surrounding error handling, and a real failing
  # fsync cannot be arranged portably.
  - id: coverage-publish-sync-file-failure
    tool: coverage
    kind: unreachable-branch
    path: internal/publish/operations.go
    function: syncFile
    anchor: 'err = fmt.Errorf("sync file: %w", err)'
    retained_property: a failed flush stops publication before the rename

  # fsync on a directory handle that was just opened fails with something other than EINVAL or ENOTSUP
  # only on a device fault, which no test can provoke; the unsupported-filesystem case is covered and
  # treated as success by design.
  - id: coverage-publish-sync-directory-failure-darwin
    tool: coverage
    kind: unreachable-branch
    goos: darwin
    path: internal/publish/sync_unix.go
    function: syncDirectory
    anchor: 'err = fmt.Errorf("sync directory: %w", err)'
    retained_property: only genuine directory flush failures are reported; unsupported filesystems are not

  # fsync on a directory handle that was just opened fails with something other than EINVAL or ENOTSUP
  # only on a device fault, which no test can provoke; the unsupported-filesystem case is covered and
  # treated as success by design.
  - id: coverage-publish-sync-directory-failure-linux
    tool: coverage
    kind: unreachable-branch
    goos: linux
    path: internal/publish/sync_unix.go
    function: syncDirectory
    anchor: 'err = fmt.Errorf("sync directory: %w", err)'
    retained_property: only genuine directory flush failures are reported; unsupported filesystems are not

  # api.LoadConfiguration in stateless mode reads no files and has no failing input; it is an error
  # return of the library's signature that the built-in configuration never takes.
  - id: coverage-pdfengine-new-configuration-failure
    tool: coverage
    kind: unreachable-branch
    path: internal/pdfengine/engine.go
    function: New
    anchor: 'return nil, fmt.Errorf("load stateless pdfcpu configuration: %w", err)'
    retained_property: a configuration failure would be reported with its cause

  # Close on a read-only regular file after a successful read fails only on a filesystem fault; the
  # read, stat and open failure paths are all covered.
  - id: coverage-pdfengine-close-after-read-failure
    tool: coverage
    kind: unreachable-branch
    path: internal/pdfengine/engine.go
    function: Engine.readFileDocument
    anchor: 'return nil, newError(CodeUnreadable, source, path, closeErr)'
    retained_property: a failed close is reported as an unreadable source

  # Every stage ends a failure with stop, stopWith or stopAll, which record the diagnostics and return
  # errStopped, so no stage can return any other error today; the branch is the guard that keeps a future
  # stage which returns a bare error from ending the run with status ok. A real stage cannot be made to
  # break the contract, and a stub that breaks it would test the stub.
  - id: coverage-app-stage-breaks-stop-contract
    tool: coverage
    kind: unreachable-branch
    path: internal/app/pipeline.go
    function: pipeline.run
    anchor: 'found := classify(stageInput, err)'
    retained_property: a stage that fails without recording its failure still ends the run as a failure

  # readContext and inspectContext return only *Error values by construction, so the fallback for a
  # foreign error type is defensive and cannot be reached through them.
  - id: coverage-pdfengine-output-failure-non-engine-error
    tool: coverage
    kind: unreachable-branch
    path: internal/pdfengine/assemble.go
    function: asOutputFailure
    anchor: 'return err'
    retained_property: foreign errors would pass through unchanged

  # shapeRun fails only when the shaping engine returns glyph clusters that contradict its own text
  # indexes, a bug in the third-party library that no input text can trigger; inputs the shaper cannot
  # handle are rejected earlier as TextError values, which are tested.
  - id: coverage-typeset-shape-run-failure
    tool: coverage
    kind: unreachable-branch
    path: internal/typeset/shape.go
    function: Shaper.shapeChecked
    anchor: 'return nil, err'
    retained_property: an inconsistent shaping result is reported instead of laid out

  # Reader failures arrive as *Error from the plan reader and malformed JSON as jsontext syntactic
  # errors; a third error type would be a new failure mode of the standard library's decoder, so the
  # generic read-failed fallback has no input.
  - id: coverage-plan-syntax-error-fallback
    tool: coverage
    kind: unreachable-branch
    path: internal/plan/decode.go
    function: parser.syntaxError
    anchor: 'return p.fail(StageRead, CodeReadFailed, p.absolute(), "", "cannot read the plan: %v", err)'
    retained_property: an unclassified decoder error is reported as a read failure

  # The compressor writes exclusively to bytes.Buffer, whose Write cannot return an error.
  # Discarding this impossible result avoids propagating unreachable error branches to every caller;
  # writing the actual PDF to its output sink still checks every error.
  - id: lint-genpage-buffer-compress-write
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: errcheck
    path: internal/genpage/write.go
    message: Error return value of `d\.flate\.Write` is not checked
    source: _, _ = d\.flate\.Write\(data\)
    retained_property: every actual output sink error remains checked

  # Closing the compressor flushes only to bytes.Buffer, which cannot fail. The actual PDF sink
  # retains checked writes, so this exact dismissal removes unreachable compression plumbing.
  - id: lint-genpage-buffer-compress-close
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: errcheck
    path: internal/genpage/write.go
    message: Error return value of `d\.flate\.Close` is not checked
    source: _ = d\.flate\.Close\(\)
    retained_property: every actual output sink error remains checked

  # os.Executable returns this running test binary's pathname from the operating system, not user
  # input. Reading those exact bytes is the real native executable-header oracle; substituting a
  # fake or header-only file would weaken the test's claim.
  - id: lint-archive-test-native-executable
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: tools/qualitygate/archives_internal_test.go
    message: 'G304: Potential file inclusion via variable'
    source: data, err := os\.ReadFile\(executable\)
    retained_property: the native executable header is inspected from its actual bytes

  # The embedded TextSettings must come first to satisfy embeddedstructfieldcheck and flatten the
  # standard JSON shape without bespoke serializers. Native Go measurements show identical object
  # sizes before and after reordering; fieldalignment saves only 40 bytes of pointer-scan extent.
  # Bounded detail queries and the declared distinct-style envelope keep that scan cost explicit.
  - id: lint-report-text-embedding-alignment
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: govet
    path: internal/report/model.go
    message: 'fieldalignment: Text has 152 leading bytes of pointer data but optimal value is 112'
    source: 'Text struct \{'
    retained_property: standard flattened JSON and idiomatic embedding retain measured object sizes

  # The embedded TextSettings must come first to satisfy embeddedstructfieldcheck and flatten the
  # standard JSON shape without bespoke serializers. Native Go measurements show identical object
  # sizes before and after reordering; fieldalignment saves only 40 bytes of pointer-scan extent.
  # Bounded detail queries and the declared distinct-style envelope keep that scan cost explicit.
  - id: lint-report-text-detail-embedding-alignment
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: govet
    path: internal/report/query.go
    message: 'fieldalignment: TextDetail has 200 leading bytes of pointer data but optimal value is 160'
    source: 'TextDetail struct \{'
    retained_property: standard flattened JSON and idiomatic embedding retain measured object sizes

  # The pinned unused analyzer reports the blank identifier and descriptive names in interface and
  # function-type signatures as unused variables when this option is false. Those are not unused
  # runtime arguments. Unparam, with check-exported true, independently rejects actual unused
  # behavior parameters; the real lint negative control defends that replacement.
  - id: lint-unused-parameter-contracts
    tool: golangci-lint
    kind: duplicate-rule
    effect: setting-item
    setting: linters.settings.unused.parameters-are-used
    values: ["true"]
    superseded_by: [unparam]
    retained_property: real unused behavior parameters remain rejected by unparam

  # These concrete standard-library methods return nil for every error result. The fmt scopes match
  # only statically concrete buffer arguments; the selected SDK verifies Fprintf returns solely their
  # Write error. Arbitrary io.Writer and os.File calls remain checked by real negative controls. A gate reads
  # the selected Go SDK implementations and rejects any non-nil error return, so a changed contract
  # cannot silently inherit this exception. Fallible Writer interfaces remain fully checked.
  - id: lint-errcheck-infallible-buffer-methods
    tool: golangci-lint
    kind: ignored-value
    effect: setting-item
    setting: linters.settings.errcheck.exclude-functions
    values:
      - (*strings.Builder).WriteRune
      - (*strings.Builder).WriteString
      - (*bytes.Buffer).Write
      - (*bytes.Buffer).WriteString
      - fmt.Fprintf(*strings.Builder)
