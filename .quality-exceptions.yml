  # Fuzz launches are constructed only by runFuzzTarget from the Go executable, compiler-discovered packages and fixed structured flags. No shell receives product input; lifecycle controls retain child exit and cleanup failures.
  - id: lint-fuzz-owned-process-command
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: gosec
    path: tools/qualitygate/process_fuzz.go
    message: "G204: Subprocess launched with a potential tainted input or cmd arguments"
    source: "exec\\.Command\\(c\\.name, c\\.args\\.\\.\\.\\)"
    retained_property: only the discovered Go fuzz target and fixed structured arguments are launched without a shell

  # The native observer owns the actual caller context, group termination and bounded pipe drain before the sole Wait. CommandContext can race cancellation against reaping and release PID authority before group cleanup finishes.
  - id: lint-fuzz-owned-process-context
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: noctx
    path: tools/qualitygate/process_fuzz.go
    message: "os/exec\\.Command must not be called\\. use os/exec\\.CommandContext"
    source: "exec\\.Command\\(c\\.name, c\\.args\\.\\.\\.\\)"
    retained_property: actual context cancellation terminates the owned group before releasing the unreaped leader identity

  # The Darwin fuzz controller must observe native process exit and inherited group terminal state before reaping the leader. Its kernel boundary is confined to this observer; real lifecycle controls verify cancellation and cleanup ownership.
  - id: lint-fuzz-darwin-exit-observer
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: depguard
    path: tools/qualitygate/process_fuzz_darwin.go
    message: "import 'golang\\.org/x/sys/unix' is not allowed from list 'platform-boundary': OS-specific syscalls belong to publish, capture, app, permissiontest, cmd and the scale harness"
    source: "\"golang\\.org/x/sys/unix\""
    goos: darwin
    retained_property: native process observation retains leader identity until owned group cleanup completes

  # The Linux fuzz controller must observe native process exit without reaping the leader while inherited group members are drained. Its kernel boundary is confined to this observer; real lifecycle controls verify cancellation and cleanup ownership.
  - id: lint-fuzz-linux-exit-observer
    tool: golangci-lint
    kind: intended-pattern
    effect: exclude-diagnostic
    linter: depguard
    path: tools/qualitygate/process_fuzz_linux.go
    message: "import 'golang\\.org/x/sys/unix' is not allowed from list 'platform-boundary': OS-specific syscalls belong to publish, capture, app, permissiontest, cmd and the scale harness"
    source: "\"golang\\.org/x/sys/unix\""
    goos: linux
    retained_property: native process observation retains leader identity until owned group cleanup completes
