# Deliberate defects the test suite must detect (go run ./tools/qualitygate controls).
#
# Each control replaces one source line, found by its exact trimmed text, with a line that still
# compiles but breaks a property the project promises. The package's tests must then fail. A control
# whose anchor no longer occurs exactly once, or whose defect no longer compiles, is reported as broken:
# update it to the current code (keep the property, change the anchor) when the code it targets moves.
version: 1
controls:
  # Strict plan decoding rejects data after the top-level value.
  - id: plan-accepts-trailing-data
    package: ./internal/plan
    file: internal/plan/decode.go
    anchor: if !isJSONSpace(p.doc.data[position]) {
    replacement: if false && !isJSONSpace(p.doc.data[position]) {

  # Publication refuses to replace an existing destination without explicit authorization.
  - id: publish-ignores-overwrite-policy
    package: ./internal/publish
    file: internal/publish/publish.go
    anchor: "case existing == refuseExisting:"
    replacement: "case false:"

  # The output page order is the sequence order.
  - id: layout-reorders-source-runs
    package: ./internal/assembly
    file: internal/assembly/layout.go
    anchor: 'r.layout.Runs = append(r.layout.Runs, Run{Kind: RunSource, Index: contribution.File, FirstPage: 1, Count: pages})'
    replacement: 'r.layout.Runs = append([]Run{{Kind: RunSource, Index: contribution.File, FirstPage: 1, Count: pages}}, r.layout.Runs...)'

  # Measured allowed overflow remains visible in the captured diagnostic authority.
  - id: report-omits-layout-warnings
    package: ./internal/report
    file: internal/report/builder.go
    anchor: 'out.Diagnostics = append(out.Diagnostics, layoutWarnings(&out)...)'
    replacement: 'out.Diagnostics = append(out.Diagnostics, []Diagnostic{}...)'

  # Selected contributions expose their own relevant warning records.
  - id: report-hides-selected-part-warnings
    package: ./internal/report
    file: internal/report/query.go
    anchor: 'WarningCount: r.relevantCounts([]string{part.ID}).WarningCount,'
    replacement: 'WarningCount: 0,'

  # Buffered codec output must observe cancellation and the decoded-read work interval.
  - id: decode-ignores-buffered-output-cancellation
    package: github.com/pdfcpu/pdfcpu/pkg/filter
    file: third_party/pdfcpu/pdfcpu/pkg/filter/filter.go
    anchor: 'r = ContextReader(f.ctx, r)'
    replacement: 'r = ContextReader(nil, r)'

  # A predictor row must fit the remaining output budget before being appended.
  - id: decode-appends-predictor-output-beyond-limit
    package: github.com/pdfcpu/pdfcpu/pkg/filter
    file: third_party/pdfcpu/pdfcpu/pkg/filter/flateDecode.go
    anchor: 'if limit := f.decodeLimit(maxLen); limit >= 0 && int64(len(row)) > limit-int64(b.Len()) {'
    replacement: 'if limit := f.decodeLimit(maxLen); false && limit >= 0 && int64(len(row)) > limit-int64(b.Len()) {'

  # Complete isolated source objects must not discard material after the parsed object.
  - id: source-accepts-material-after-object-body
    package: github.com/pdfcpu/pdfcpu/pkg/pdfcpu
    file: third_party/pdfcpu/pdfcpu/pkg/pdfcpu/read.go
    anchor: 'if err = objectBodyRemainder(c, *line); err != nil {'
    replacement: 'if err = nil; err != nil {'
